ext><rect x="40.0" y="630" width="220" height="30" rx="8" fill="#fbf0db" stroke="#96590a" stroke-width="1.2"/><text x="54.0" y="654" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="680" fill="#96590a" text-anchor="start"></text><text x="150" y="650" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#454c54" text-anchor="middle">banner; may keep recording</text><rect x="385" y="530" width="190" height="52" rx="8" fill="#e8edfc" stroke="#2b4acb" stroke-width="1.2"/><text x="399" y="554" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="680" fill="#2b4acb" text-anchor="start"></text><text x="480" y="551" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="650" fill="#2b4acb" text-anchor="middle">overlap → lower epoch</text><text x="480" y="568" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="650" fill="#2b4acb" text-anchor="middle">becomes “pending”</text><path d="M575 556 L915 556" stroke="#6b46b0" stroke-width="1.5" fill="none" marker-end="url(#a-violet)"/><rect x="703.4" y="538.0" width="83.19999999999999" height="17" rx="5" fill="#f6f5f1"/><text x="745.0" y="550.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#6b46b0" text-anchor="middle">review queue</text><rect x="915" y="536" width="170" height="76" rx="12" fill="#efe9fa" stroke="#6b46b0" stroke-width="1.2"/><text x="929" y="560" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="680" fill="#6b46b0" text-anchor="start">Accept → counts</text><text x="929" y="577" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">Exclude → kept,</text><text x="929" y="594" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">hidden, reason logged</text></svg>