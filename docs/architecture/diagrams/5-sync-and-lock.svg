#1b1f23" text-anchor="start">5 · Offline sync and the session lock</text><text x="36" y="70" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400" fill="#6a717a" text-anchor="start">One student, two devices. The latest lock holder&#x27;s data counts; the other is kept and reviewed — nothing is dropped.</text><rect x="65" y="100" width="170" height="40" rx="12" fill="#e2f3e9" stroke="#1d7a4b" stroke-width="1.2"/><text x="150.0" y="124" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="680" fill="#1d7a4b" text-anchor="middle">Marcus&#x27;s phone</text><path d="M150 140 V 670" stroke="#d9d5cb" stroke-width="1.5"/><rect x="395" y="100" width="170" height="40" rx="12" fill="#e8edfc" stroke="#2b4acb" stroke-width="1.2"/><text x="480.0" y="124" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="680" fill="#2b4acb" text-anchor="middle">API + database</text><path d="M480 140 V 670" stroke="#d9d5cb" stroke-width="1.5"/><rect x="715" y="100" width="170" height="40" rx="12" fill="#fbf0db" stroke="#96590a" stroke-width="1.2"/><text x="800.0" y="124" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="680" fill="#96590a" text-anchor="middle">Jo&#x27;s tablet</text><path d="M800 140 V 670" stroke="#d9d5cb" stroke-width="1.5"/><rect x="915" y="100" width="170" height="40" rx="12" fill="#efe9fa" stroke="#6b46b0" stroke-width="1.2"/><text x="1000.0" y="124" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="680" fill="#6b46b0" text-anchor="middle">BCBA</text><path d="M1000 140 V 670" stroke="#d9d5cb" stroke-width="1.5"/><path d="M156 180 L474 180" stroke="#454c54" stroke-width="1.5" fill="none" marker-end="url(#a-ink2)"/><rect x="258.15" y="162.0" width="113.6999