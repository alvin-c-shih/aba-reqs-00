#1b1f23" text-anchor="start">1 · System context</text><text x="36" y="70" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400" fill="#6a717a" text-anchor="start">Who uses the system and what it depends on. Everything inside the dashed line is this repository.</text><rect x="40" y="110" width="160" height="86" rx="12" fill="#e2f3e9" stroke="#1d7a4b" stroke-width="1.2"/><text x="54" y="134" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="680" fill="#1d7a4b" text-anchor="start">RBT</text><text x="54" y="151" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">Records sessions,</text><text x="54" y="168" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">online or offline</text><path d="M120 196 L320 258" stroke="#1d7a4b" stroke-width="1.5" fill="none" marker-end="url(#a-ok)"/><rect x="212" y="110" width="160" height="86" rx="12" fill="#e8edfc" stroke="#2b4acb" stroke-width="1.2"/><text x="226" y="134" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="680" fill="#2b4acb" text-anchor="start">BCBA</text><text x="226" y="151" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">Reads graphs,</text><text x="226" y="168" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">decides what changes</text><path d="M292 196 L412 258" stroke="#2b4acb" stroke-width="1.5" fill="none" marker-end="url(#a-accent)"/><rect x="384" y="110" width="160" height="86" rx="12" fill="#eceef0" stroke="#59636b" stroke-width="1.2"/><text x="398" y="134" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="680" fill="#59636b" text-anchor="start">Parent</text><text x="398" y="151" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">Sees what the team</text><text x="398" y="168" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">shares; counts at home</text><path d="M464 196 L504 258" stroke="#59636b" stroke-width="1.5" fill="none" marker-end="url(#a-slate)"/><rect x="556" y="110" width="160" height="86" rx="12" fill="#eceef0" stroke="#59636b" stroke-width="1.2"/><text x="570" y="134" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="680" fill="#59636b" text-anchor="start">Teacher</text><text x="570" y="151" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">Sees goals; sends</text><text x="570" y="168" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">classroom notes</text><path d="M636 196 L596 258" stroke="#59636b" stroke-width="1.5" fill="none" marker-end="url(#a-slate)"/><rect x="728" y="110" width="160" height="86" rx="12" fill="#fbf0db" stroke="#96590a" stroke-width="1.2"/><text x="742" y="134" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="680" fill="#96590a" text-anchor="start">School admin</text><text x="742" y="151" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-ancho