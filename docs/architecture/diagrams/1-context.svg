ne installable React app</text><text x="304" y="327" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">Role areas: system · school · clinic · collect · family — phone-first for recording</text><path d="M550 364 L550 398" stroke="#454c54" stroke-width="1.5" fill="none" marker-end="url(#a-ink2)" marker-start="url(#as)"/><rect x="429.1" y="363.0" width="241.79999999999998" height="17" rx="5" fill="#f6f5f1"/><text x="550.0" y="375.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#454c54" text-anchor="middle">HTTPS  /api/v1  (same origin, cookies)</text><rect x="290" y="400" width="250" height="88" rx="12" fill="#ffffff" stroke="#d9d5cb" stroke-width="1.2"/><text x="304" y="424" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="680" fill="#1b1f23" text-anchor="start">API</text><text x="304" y="441" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">FastAPI, one process</text><text x="304" y="458" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">auth · access rules · analytics · sync</text><rect x="580" y="400" width="230" height="88" rx="12" fill="#ffffff" stroke="#d9d5cb" stroke-width="1.2"/><text x="594" y="424" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="680" fill="#1b1f23" text-anchor="start">PostgreSQL</text><text x="594" y="441" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">one database per environment</text><text x="594" y="458" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">row-level security per school</text><path d="M540 444 L578 444" stroke="#454c54" stroke-width="1.5" fill="none" marker-end="url(#a-ink2)" marker-start="url(#as)"/><rect x="880" y="290" width="190" height="88" rx="12" fill="#efe9fa" stroke="#6b46b0" stroke-width="1.2"/><text x="894" y="314" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="680" fill="#6b46b0" text-anchor="start">Local models (optional)</text><text x="894" y="331" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">Ollama · Whisper on this</text><text x="894" y="348" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">machine; off by default</text><rect x="880" y="400" width="190" height="70" rx="12" fill="#eceef0" stroke="#59636b" stroke-width="1.2"/><text x="894" y="424" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="680" fill="#59636b" text-anchor="start">Not built</text><text x="894" y="441" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">email · SMS · push</text><text x="894" y="458" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">payer formats</text><rect x="40" y="300" width="170" height="70" rx="12" fill="#eceef0" stroke="#59636b" stroke-width="1.2"/><text x="54" y="324" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="680" fill="#59636b" text-