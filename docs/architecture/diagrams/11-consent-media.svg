<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640" role="img"><defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6a717a"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b46b0"/></marker><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#59636b"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2b4acb"/></marker><marker id="a-ink2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#454c54"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d7a4b"/></marker><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d9d5cb"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b3312b"/></marker><marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#96590a"/></marker><marker id="as" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" fill="#454c54"/></marker></defs><rect width="1100" height="640" rx="18" fill="#f6f5f1"/><text x="36" y="46" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#1b1f23" text-anchor="start">11 · Consent and media</text><text x="36" y="70" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400" fill="#6a717a" text-anchor="start">A photo or video is stored only while a recorded consent of that kind is current. Viewing is limited to the clinical team.</text><text x="60" y="104" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#6a717a" text-anchor="start" letter-spacing="1.1">UPLOAD  ·  RBT OR BCBA</text><rect x="60" y="114" width="380" height="58" rx="12" fill="#ffffff" stroke="#d9d5cb" stroke-width="1.2"/><text x="74" y="138" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="680" fill="#1b1f23" text-anchor="start">1  Student in scope</text><text x="74" y="155" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">deps.py: caseload or assignment</text><path d="M440 143.0 L486 143.0" stroke="#b3312b" stroke-width="1.5" fill="none" marker-end="url(#a-bad)"/><text x="494" y="147.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#b3312b" text-anchor="start">404 not found</text><path d="M250.0 172 L250.0 186" stroke="#6a717a" stroke-width="1.5" fill="none" marker-end="url(#a-muted)"/><rect x="60" y="186" width="380" height="58" rx="12" fill="#ffffff" stroke="#d9d5cb" stroke-width="1.2"/><text x="74" y="210" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="680" fill="#1b1f23" text-anchor="start">2  Type allow-list</text><text x="74" y="227" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">JPEG, PNG, WebP · MP4, WebM, MOV</text><path d="M440 215.0 L486 215.0" stroke="#b3312b" stroke-width="1.5" fill="none" marker-end="url(#a-bad)"/><text x="494" y="219.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#b3312b" text-anchor="start">415 unsupported</text><path d="M250.0 244 L250.0 258" stroke="#6a717a" stroke-width="1.5" fill="none" marker-end="url(#a-muted)"/><rect x="60" y="258" width="380" height="58" rx="12" fill="#efe9fa" stroke="#6b46b0" stroke-width="1.2"/><text x="74" y="282" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="680" fill="#6b46b0" text-anchor="start">3  Current consent of that kind</text><text x="74" y="299" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">photo and video are consented separately</text><path d="M440 287.0 L486 287.0" stroke="#b3312b" stroke-width="1.5" fill="none" marker-end="url(#a-bad)"/><text x="494" y="291.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#b3312b" text-anchor="start">403 no consent on record</text><path d="M250.0 316 L250.0 330" stroke="#6a717a" stroke-width="1.5" fill="none" marker-end="url(#a-muted)"/><rect x="60" y="330" width="380" height="58" rx="12" fill="#ffffff" stroke="#d9d5cb" stroke-width="1.2"/><text x="74" y="354" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="680" fill="#1b1f23" text-anchor="start">4  Size</text><text x="74" y="371" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">25 MB at most</text><path d="M440 359.0 L486 359.0" stroke="#b3312b" stroke-width="1.5" fill="none" marker-end="url(#a-bad)"/><text x="494" y="363.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#b3312b" text-anchor="start">413 too large</text><path d="M250.0 388 L250.0 402" stroke="#6a717a" stroke-width="1.5" fill="none" marker-end="url(#a-muted)"/><rect x="60" y="402" width="380" height="58" rx="12" fill="#e2f3e9" stroke="#1d7a4b" stroke-width="1.2"/><text x="74" y="426" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="680" fill="#1d7a4b" text-anchor="start">5  Store · file name chosen by the server</text><text x="74" y="443" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">data/media/&lt;env&gt;/&lt;school&gt;/&lt;uuid&gt;.&lt;ext&gt;</text><path d="M250.0 460 L250.0 474" stroke="#6a717a" stroke-width="1.5" fill="none" marker-end="url(#a-muted)"/><rect x="60" y="474" width="380" height="58" rx="12" fill="#fbf0db" stroke="#96590a" stroke-width="1.2"/><text x="74" y="498" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="680" fill="#96590a" text-anchor="start">6  Row + audit</text><text x="74" y="515" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">media row (RLS) · media.uploaded</text><rect x="720" y="114" width="344" height="190" rx="16" fill="none" stroke="#6b46b0" stroke-width="1.2" stroke-dasharray="5 5"/><text x="734" y="106" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#6b46b0" text-anchor="start" letter-spacing="1.1">CONSENT — BCBA ONLY</text><rect x="736" y="130" width="312" height="74" rx="12" fill="#ffffff" stroke="#d9d5cb" stroke-width="1.2"/><text x="750" y="154" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="680" fill="#1b1f23" text-anchor="start">Record</text><text x="750" y="171" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">who gave it, how (form, email…), date</text><text x="750" y="188" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">a new record replaces the old one</text><rect x="736" y="214" width="312" height="74" rx="12" fill="#ffffff" stroke="#d9d5cb" stroke-width="1.2"/><text x="750" y="238" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="680" fill="#1b1f23" text-anchor="start">Revoke</text><text x="750" y="255" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">new uploads are refused at step 3</text><text x="750" y="272" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">existing files stay until removed</text><rect x="720" y="334" width="344" height="152" rx="16" fill="none" stroke="#1d7a4b" stroke-width="1.2" stroke-dasharray="5 5"/><text x="734" y="326" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#1d7a4b" text-anchor="start" letter-spacing="1.1">AFTER UPLOAD</text><rect x="736" y="350" width="312" height="56" rx="12" fill="#ffffff" stroke="#d9d5cb" stroke-width="1.2"/><text x="750" y="374" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="680" fill="#1b1f23" text-anchor="start">View</text><text x="750" y="391" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">clinical team only · audited · never cached</text><rect x="736" y="416" width="312" height="56" rx="12" fill="#ffffff" stroke="#d9d5cb" stroke-width="1.2"/><text x="750" y="440" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="680" fill="#1b1f23" text-anchor="start">Remove</text><text x="750" y="457" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">BCBA · row hidden, action audited</text><rect x="720" y="508" width="344" height="102" rx="12" fill="#fae5e3" stroke="#b3312b" stroke-width="1.2"/><text x="734" y="532" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="680" fill="#b3312b" text-anchor="start">Known gaps</text><text x="734" y="549" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">Parents and teachers cannot see media</text><text x="734" y="566" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">Removed and reset files stay on disk</text><text x="734" y="583" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">No virus scan; no in-app video capture</text></svg>