<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" width="1100" height="660" role="img"><defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6a717a"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b46b0"/></marker><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#59636b"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2b4acb"/></marker><marker id="a-ink2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#454c54"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d7a4b"/></marker><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d9d5cb"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b3312b"/></marker><marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#96590a"/></marker><marker id="as" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" fill="#454c54"/></marker></defs><rect width="1100" height="660" rx="18" fill="#f6f5f1"/><text x="36" y="46" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#1b1f23" text-anchor="start">10 · Sign-in and two-factor</text><text x="36" y="70" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400" fill="#6a717a" text-anchor="start">Every sign-in passes the same chain. A wrong second factor counts toward the lock exactly like a wrong password.</text><text x="60" y="104" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#6a717a" text-anchor="start" letter-spacing="1.1">SIGN-IN</text><rect x="60" y="114" width="380" height="58" rx="12" fill="#ffffff" stroke="#d9d5cb" stroke-width="1.2"/><text x="74" y="138" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="680" fill="#1b1f23" text-anchor="start">1  Throttle</text><text x="74" y="155" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">per address, in the API process</text><path d="M440 143.0 L486 143.0" stroke="#b3312b" stroke-width="1.5" fill="none" marker-end="url(#a-bad)"/><text x="494" y="147.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#b3312b" text-anchor="start">429 slow down</text><path d="M250.0 172 L250.0 186" stroke="#6a717a" stroke-width="1.5" fill="none" marker-end="url(#a-muted)"/><rect x="60" y="186" width="380" height="58" rx="12" fill="#ffffff" stroke="#d9d5cb" stroke-width="1.2"/><text x="74" y="210" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="680" fill="#1b1f23" text-anchor="start">2  Locked?</text><text x="74" y="227" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">5 failures lock the account for 15 minutes</text><path d="M440 215.0 L486 215.0" stroke="#b3312b" stroke-width="1.5" fill="none" marker-end="url(#a-bad)"/><text x="494" y="219.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#b3312b" text-anchor="start">423 locked</text><path d="M250.0 244 L250.0 258" stroke="#6a717a" stroke-width="1.5" fill="none" marker-end="url(#a-muted)"/><rect x="60" y="258" width="380" height="58" rx="12" fill="#e8edfc" stroke="#2b4acb" stroke-width="1.2"/><text x="74" y="282" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="680" fill="#2b4acb" text-anchor="start">3  Password</text><text x="74" y="299" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">Argon2id · same error for unknown email or wrong password</text><path d="M440 287.0 L486 287.0" stroke="#b3312b" stroke-width="1.5" fill="none" marker-end="url(#a-bad)"/><text x="494" y="291.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#b3312b" text-anchor="start">401 generic · failure counted</text><path d="M250.0 316 L250.0 330" stroke="#6a717a" stroke-width="1.5" fill="none" marker-end="url(#a-muted)"/><rect x="60" y="330" width="380" height="58" rx="12" fill="#efe9fa" stroke="#6b46b0" stroke-width="1.2"/><text x="74" y="354" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="680" fill="#6b46b0" text-anchor="start">4  Second factor, if enrolled</text><text x="74" y="371" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">6-digit code (±30 s drift) or a one-use recovery code</text><path d="M440 359.0 L486 359.0" stroke="#b3312b" stroke-width="1.5" fill="none" marker-end="url(#a-bad)"/><text x="494" y="363.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#b3312b" text-anchor="start">401 · failure counted</text><path d="M250.0 388 L250.0 402" stroke="#6a717a" stroke-width="1.5" fill="none" marker-end="url(#a-muted)"/><rect x="60" y="402" width="380" height="58" rx="12" fill="#e2f3e9" stroke="#1d7a4b" stroke-width="1.2"/><text x="74" y="426" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="680" fill="#1d7a4b" text-anchor="start">5  Issue session</text><text x="74" y="443" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">15-min access token + rotating refresh, httpOnly cookies</text><path d="M250.0 460 L250.0 474" stroke="#6a717a" stroke-width="1.5" fill="none" marker-end="url(#a-muted)"/><rect x="60" y="474" width="380" height="58" rx="12" fill="#fbf0db" stroke="#96590a" stroke-width="1.2"/><text x="74" y="498" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="680" fill="#96590a" text-anchor="start">6  Audit row</text><text x="74" y="515" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">login · login.failed · login.2fa_failed · login.locked</text><rect x="60" y="552" width="380" height="62" rx="12" fill="#eceef0" stroke="#59636b" stroke-width="1.2"/><text x="74" y="576" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="680" fill="#59636b" text-anchor="start">Later requests</text><text x="74" y="593" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">A reused refresh token revokes the whole chain</text><rect x="720" y="114" width="344" height="300" rx="16" fill="none" stroke="#6b46b0" stroke-width="1.2" stroke-dasharray="5 5"/><text x="734" y="106" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#6b46b0" text-anchor="start" letter-spacing="1.1">ENROLMENT — ACCOUNT → SECURITY</text><rect x="736" y="130" width="312" height="56" rx="12" fill="#ffffff" stroke="#d9d5cb" stroke-width="1.2"/><text x="750" y="154" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="680" fill="#1b1f23" text-anchor="start">Start</text><text x="750" y="171" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">server makes a secret; shown as a key to type</text><rect x="736" y="198" width="312" height="56" rx="12" fill="#ffffff" stroke="#d9d5cb" stroke-width="1.2"/><text x="750" y="222" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="680" fill="#1b1f23" text-anchor="start">Confirm</text><text x="750" y="239" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">enter one code from the app to switch it on</text><rect x="736" y="266" width="312" height="56" rx="12" fill="#ffffff" stroke="#d9d5cb" stroke-width="1.2"/><text x="750" y="290" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="680" fill="#1b1f23" text-anchor="start">Recovery codes</text><text x="750" y="307" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">8 codes, shown once, stored only as hashes</text><rect x="736" y="334" width="312" height="56" rx="12" fill="#ffffff" stroke="#d9d5cb" stroke-width="1.2"/><text x="750" y="358" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="680" fill="#1b1f23" text-anchor="start">Switch off</text><text x="750" y="375" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">needs a current code or a recovery code</text><rect x="720" y="438" width="344" height="150" rx="12" fill="#fae5e3" stroke="#b3312b" stroke-width="1.2"/><text x="734" y="462" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="680" fill="#b3312b" text-anchor="start">Known gaps</text><text x="734" y="479" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">Not enforced for any role yet</text><text x="734" y="496" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">No QR code: the key is typed by hand</text><text x="734" y="513" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">The secret is stored unencrypted in the</text><text x="734" y="530" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">database; relies on disk encryption</text><text x="734" y="547" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">No password reset by email</text></svg>