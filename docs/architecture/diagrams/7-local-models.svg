#1b1f23" text-anchor="start">7 · Local models</text><text x="36" y="70" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400" fill="#6a717a" text-anchor="start">Optional helper processes on the same machine as the API. Student data never crosses the dashed line.</text><rect x="36" y="104" width="1028" height="396" rx="16" fill="none" stroke="#6b46b0" stroke-width="1.2" stroke-dasharray="5 5"/><text x="50" y="96" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#6b46b0" text-anchor="start" letter-spacing="1.1">THIS MACHINE ONLY — AI.PY REFUSES ANY OTHER HOST</text><rect x="56" y="124" width="240" height="108" rx="12" fill="#e8edfc" stroke="#2b4acb" stroke-width="1.2"/><text x="70" y="148" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="680" fill="#2b4acb" text-anchor="start">Draft a family summary</text><text x="70" y="165" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">BCBA · Progress report</text><text x="70" y="182" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">in: program_facts, first name,</text><text x="70" y="199" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">family-friendly goal names</text><rect x="56" y="246" width="240" height="92" rx="12" fill="#e8edfc" stroke="#2b4acb" stroke-width="1.2"/><text x="70" y="270" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="680" fill="#2b4acb" text-anchor="start">Ask about my caseload</text><text x="70" y="287" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">BCBA · Caseload</text><text x="70" y="304" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">in: status facts already on screen</text><rect x="56" y="352" width="240" height="108" rx="12" fill="#e2f3e9" stroke="#1d7a4b" stroke-width="1.2"/><text x="70" y="376" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="680" fill="#1d7a4b" text-anchor="start">Dictate a session note</text><text x="70" y="393" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">RBT or BCBA · End session</text><text x="70" y="410" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">in: up to 60 s of audio (8 MB cap),</text><text x="70" y="427" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">transcribed, then discarded</text><rect x="380" y="124" width="250" height="336" rx="12" fill="#ffffff" stroke="#d9d5cb" stroke-width="1.2"/><text x="394" y="148" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="680" fill="#1b1f23" text-anchor="start">API · aba/ai.py</text><text x="396" y="176" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="650" fill="#1b1f23" text-anchor="start">1  School switch</text><text x="396" y="193" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#6a717a" text-anchor="star