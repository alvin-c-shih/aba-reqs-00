nt-weight="400" fill="#6a717a" text-anchor="start">a person edits and publishes</text><rect x="720" y="118" width="324" height="92" rx="12" fill="#efe9fa" stroke="#6b46b0" stroke-width="1.2"/><text x="734" y="142" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="680" fill="#6b46b0" text-anchor="start">llama.cpp llama-server  ·  :8080</text><text x="734" y="159" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">text, tried first when LLM_URL is set</text><text x="734" y="176" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">POST /v1/chat/completions · thinking off</text><text x="734" y="193" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">model: Gemma 4 26B (Q5_K_M) · draft ≈ 7 s</text><rect x="720" y="218" width="324" height="76" rx="12" fill="#efe9fa" stroke="#6b46b0" stroke-width="1.2"/><text x="734" y="242" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="680" fill="#6b46b0" text-anchor="start">Ollama 0.11.7  ·  :11434</text><text x="734" y="259" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">text, fallback · POST /api/generate</text><text x="734" y="276" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">mistral-nemo:12b (7.1 GB) · first answer ≈ 50 s</text><rect x="720" y="300" width="324" height="160" rx="12" fill="#e2f3e9" stroke="#1d7a4b" stroke-width="1.2"/><text x="734" y="324" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="680" fill="#1d7a4b" text-anchor="start">whisper.cpp server 1.9.5  ·  :8178</text><text x="734" y="341" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">speech to text · POST /v1/audio/transcriptions</text><text x="734" y="358" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">model: Whisper small.en (ggml, 488 MB)</text><text x="734" y="375" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">file: data/models/whisper/ (git-ignored)</text><text x="734" y="392" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">ffmpeg converts browser audio to WAV</text><text x="734" y="409" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">≈ 1 s for a 7 s note · start: make speech</text><path d="M296 178 L380 178" stroke="#2b4acb" stroke-width="1.5" fill="none" marker-end="url(#a-accent)"/><path d="M296 292 L380 292" stroke="#2b4acb" stroke-width="1.5" fill="none" marker-end="url(#a-accent)"/><path d="M296 406 L380 406" stroke="#1d7a4b" stroke-width="1.5" fill="none" marker-end="url(#a-ok)"/><path d="M630 164 L720 164" stroke="#6b46b0" stroke-width="1.5" fill="none" marker-end="url(#a-violet)"/><rect x="627.3" y="146.0" width="95.39999999999999" height="17" rx="5" fill="#f6f5f1"/><text x="675.0" y="158.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#6b46b0" text-anchor="middle">facts + prompt</text><path d="M630 