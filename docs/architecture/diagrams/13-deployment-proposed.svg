<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="1100" height="620" role="img"><defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6a717a"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b46b0"/></marker><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#59636b"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2b4acb"/></marker><marker id="a-ink2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#454c54"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d7a4b"/></marker><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d9d5cb"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b3312b"/></marker><marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#96590a"/></marker><marker id="as" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" fill="#454c54"/></marker></defs><rect width="1100" height="620" rx="18" fill="#f6f5f1"/><text x="36" y="46" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#1b1f23" text-anchor="start">13 · Deployment — proposed, not built</text><text x="36" y="70" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400" fill="#6a717a" text-anchor="start">A starting point for discussion. The server setup shown here does not exist yet; each red item is an open decision for the owner.</text><rect x="40" y="120" width="170" height="96" rx="12" fill="#e8edfc" stroke="#2b4acb" stroke-width="1.2"/><text x="54" y="144" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="680" fill="#2b4acb" text-anchor="start">Devices</text><text x="54" y="161" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">phones, tablets,</text><text x="54" y="178" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">laptops · installed</text><text x="54" y="195" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">web app</text><rect x="250" y="104" width="814" height="330" rx="16" fill="none" stroke="#59636b" stroke-width="1.2" stroke-dasharray="5 5"/><text x="264" y="96" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#59636b" text-anchor="start" letter-spacing="1.1">ONE SCHOOL-CONTROLLED SERVER (OR ONE CLOUD VM)</text><rect x="270" y="120" width="190" height="96" rx="12" fill="#fae5e3" stroke="#b3312b" stroke-width="1.2"/><text x="284" y="144" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="680" fill="#b3312b" text-anchor="start">Reverse proxy</text><text x="284" y="161" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">TLS certificate</text><text x="284" y="178" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">HTTPS only · HSTS</text><text x="284" y="195" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">request size limits</text><rect x="500" y="120" width="220" height="96" rx="12" fill="#2b4acb" stroke="#2b4acb" stroke-width="1.2"/><text x="514" y="144" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="680" fill="#ffffff" text-anchor="start">API  ·  APP_ENV=prod</text><text x="514" y="161" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#ffffff" text-anchor="start">serves the built web app</text><text x="514" y="178" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#ffffff" text-anchor="start">run by a supervisor</text><text x="514" y="195" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#ffffff" text-anchor="start">no demo or test routes</text><rect x="760" y="120" width="284" height="96" rx="12" fill="#efe9fa" stroke="#6b46b0" stroke-width="1.2"/><text x="774" y="144" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="680" fill="#6b46b0" text-anchor="start">PostgreSQL</text><text x="774" y="161" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">aba_app role for the API</text><text x="774" y="178" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">owner role for migrations only</text><text x="774" y="195" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">encrypted volume</text><rect x="270" y="250" width="190" height="96" rx="12" fill="#fae5e3" stroke="#b3312b" stroke-width="1.2"/><text x="284" y="274" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="680" fill="#b3312b" text-anchor="start">Secrets</text><text x="284" y="291" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">JWT_SECRET and db</text><text x="284" y="308" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">passwords from a</text><text x="284" y="325" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">secret store, not a file</text><rect x="500" y="250" width="220" height="96" rx="12" fill="#efe9fa" stroke="#6b46b0" stroke-width="1.2"/><text x="514" y="274" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="680" fill="#6b46b0" text-anchor="start">Local models (optional)</text><text x="514" y="291" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">text + speech helpers</text><text x="514" y="308" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">localhost only</text><text x="514" y="325" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">needs a capable machine</text><rect x="760" y="250" width="284" height="96" rx="12" fill="#fae5e3" stroke="#b3312b" stroke-width="1.2"/><text x="774" y="274" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="680" fill="#b3312b" text-anchor="start">Backups</text><text x="774" y="291" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">nightly dump + media folder</text><text x="774" y="308" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">stored off the server, encrypted</text><text x="774" y="325" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">restore drill on a schedule</text><rect x="270" y="366" width="774" height="52" rx="12" fill="#fae5e3" stroke="#b3312b" stroke-width="1.2"/><text x="284" y="390" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="680" fill="#b3312b" text-anchor="start">Monitoring: health endpoint, disk space, failed sign-ins, backup age — alert a named person</text><path d="M210 168 L270 168" stroke="#454c54" stroke-width="1.5" fill="none" marker-end="url(#a-ink2)"/><rect x="219.75" y="150.0" width="40.5" height="17" rx="5" fill="#f6f5f1"/><text x="240.0" y="162.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#454c54" text-anchor="middle">HTTPS</text><path d="M460 168 L500 168" stroke="#454c54" stroke-width="1.5" fill="none" marker-end="url(#a-ink2)"/><path d="M720 168 L760 168" stroke="#6b46b0" stroke-width="1.5" fill="none" marker-end="url(#a-violet)"/><path d="M610 216 L610 250" stroke="#6a717a" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#a-muted)"/><path d="M902 216 L902 250" stroke="#b3312b" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#a-bad)"/><rect x="40" y="462" width="500" height="128" rx="12" fill="#fae5e3" stroke="#b3312b" stroke-width="1.2"/><text x="54" y="486" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="680" fill="#b3312b" text-anchor="start">Decisions needed first</text><text x="54" y="503" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">Counsel: HIPAA or FERPA, and what that requires of hosting</text><text x="54" y="520" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">On-site server or cloud; who operates and patches it</text><text x="54" y="537" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">Recovery targets: how much data loss and downtime is acceptable</text><text x="54" y="554" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">Audit-log retention; enforced two-factor for staff</text><rect x="564" y="462" width="500" height="128" rx="12" fill="#e2f3e9" stroke="#1d7a4b" stroke-width="1.2"/><text x="578" y="486" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="680" fill="#1d7a4b" text-anchor="start">Already in the repository</text><text x="578" y="503" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">APP_ENV=prod removes persona sign-in, reset, test hooks and API docs</text><text x="578" y="520" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">The API serves the production web build (make build)</text><text x="578" y="537" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">Unprivileged database role; migrations as numbered SQL files</text><text x="578" y="554" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">Health page with row counts and a write/read canary</text></svg>