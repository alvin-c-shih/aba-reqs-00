ed)"/><text x="60" y="520" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">A mistake is fixed by adding a void row —</text><text x="60" y="537" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">the API role cannot UPDATE or DELETE here.</text><text x="60" y="566" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">Graphs are computed from this log on read;</text><text x="60" y="583" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">pending and rejected sessions are excluded.</text><rect x="770" y="380" width="290" height="240" rx="16" fill="none" stroke="#59636b" stroke-width="1.2" stroke-dasharray="5 5"/><text x="784" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#59636b" text-anchor="start" letter-spacing="1.1">ACCOUNTABILITY AND SHARING</text><rect x="790" y="400" width="250" height="50" rx="12" fill="#eceef0" stroke="#59636b" stroke-width="1.2"/><text x="804" y="424" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="680" fill="#59636b" text-anchor="start">audit_log  (append-only)</text><text x="804" y="441" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">who · role · action · entity · at</text><rect x="790" y="462" width="250" height="50" rx="12" fill="#eceef0" stroke="#59636b" stroke-width="1.2"/><text x="804" y="486" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-s