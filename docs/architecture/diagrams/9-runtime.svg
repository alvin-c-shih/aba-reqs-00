ns-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">LLM_URL — http://127.0.0.1:8080 (optional)</text><text x="54" y="426" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">OLLAMA_URL — default 127.0.0.1:11434</text><text x="54" y="443" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">AI_MODEL — default: first installed</text><text x="54" y="460" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">DATABASE_URL — default from APP_ENV</text><text x="54" y="477" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">per school: schools.settings {ai, voice}</text><rect x="400" y="300" width="320" height="190" rx="12" fill="#ffffff" stroke="#d9d5cb" stroke-width="1.2"/><text x="414" y="324" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="680" fill="#1b1f23" text-anchor="start">State on disk</text><text x="414" y="341" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">PostgreSQL data — the system of record</text><text x="414" y="358" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">data/media/&lt;env&gt;/ — photos, short videos</text><text x="414" y="375" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">data/models/whisper/ — speech model</text><text x="414" y="392" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">data/tmp/ — audio being converted; emptied</text><text x="414" y="409" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">docs/screenshots/ — walkthrough output</text><text x="414" y="426" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">Nothing else: no cache, queue or search index</text><rect x="750" y="300" width="314" height="190" rx="12" fill="#ffffff" stroke="#d9d5cb" stroke-width="1.2"/><text x="764" y="324" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="680" fill="#1b1f23" text-anchor="start">Commands</text><text x="764" y="341" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">make setup — secrets, dbs, schema, seed</text><text x="764" y="358" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">make demo — API + web, Demo env</text><text x="764" y="375" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">make speech — optional speech server</text><text x="764" y="392" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">make reset — restore demo data</text><text x="764" y="409" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">make test — 39 API tests + typecheck</text><text x="764" y="426" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">make screenshots — 78-step walkthrough</text><text x="764" y="443" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">make diagrams — these pictures</text><rect x="40" y="520" width="1024" height="66" rx="12" fill="#fae5e3" stroke="#b3312b" stroke-width="1.2"/><text x="54" y="544" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="680" fill="#b3312b" text-anchor="start">Environment gates (server-side, by APP_ENV)</text><text x="54" y="561" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">Persona sign-in: demo only · Reset: demo, dev, qa · Test hooks and API docs: never in prod · prod has no owner connection unless ADMIN_DATABASE_URL is set</text></svg>