ver  ·  :5173</text><text x="334" y="151" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">dev only · proxies /api</text><rect x="320" y="196" width="220" height="64" rx="12" fill="#2b4acb" stroke="#2b4acb" stroke-width="1.2"/><text x="334" y="220" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="680" fill="#ffffff" text-anchor="start">API (uvicorn)  ·  :8010</text><text x="334" y="237" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#ffffff" text-anchor="start">serves the built app in prod</text><rect x="600" y="110" width="220" height="150" rx="12" fill="#efe9fa" stroke="#6b46b0" stroke-width="1.2"/><text x="614" y="134" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="680" fill="#6b46b0" text-anchor="start">PostgreSQL 14</text><text x="614" y="151" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">socket /tmp · one db per env:</text><text x="614" y="168" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">aba_demo · aba_dev · aba_qa</text><text x="614" y="185" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">aba_test (pytest)</text><text x="614" y="202" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">role aba_app: API, no DDL</text><text x="614" y="219" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">owner: migrate + reset only</text><rect x="866" y="110" width="198" height="150" rx="16" fill="none" stroke="#6b46b0" stroke-width="1.2" stroke-dasharray="5 5"/><text x="880" y="102" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#6b46b0" text-anchor="start" letter-spacing="1.1">OPTIONAL · LOCALHOST</text><rect x="878" y="118" width="174" height="42" rx="12" fill="#efe9fa" stroke="#6b46b0" stroke-width="1.2"/><text x="892" y="142" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="680" fill="#6b46b0" text-anchor="start">llama-server  ·  :8080</text><rect x="878" y="164" width="174" height="42" rx="12" fill="#efe9fa" stroke="#6b46b0" stroke-width="1.2"/><text x="892" y="188" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="680" fill="#6b46b0" text-anchor="start">Ollama  ·  :11434</text><rect x="878" y="210" width="174" height="42" rx="12" fill="#e2f3e9" stroke="#1d7a4b" stroke-width="1.2"/><text x="892" y="234" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="680" fill="#1d7a4b" text-anchor="start">whisper-server  ·  :8178</text><path d="M260 145 L320 145" stroke="#454c54" stroke-width="1.5" fill="none" marker-end="url(#a-ink2)"/><path d="M430 180 L430 196" stroke="#454c54" stroke-width="1.5" fill="none" marker-end="url(#a-ink2)"/><rect x="412.8" y="170.0" width="34.4" height="17" rx="5" fill="#f6f5f1"/><text x="430.0" y="182.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#454c54" text-anchor="middle">/api</text><path d="M540 228 L600 228" stroke="#6b46b0" stroke-width="1.5" fill="none" marker-end="url(#a-violet)"/><rect x="537.55" y="210.0" width="64