<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" role="img"><defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6a717a"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b46b0"/></marker><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#59636b"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2b4acb"/></marker><marker id="a-ink2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#454c54"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d7a4b"/></marker><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d9d5cb"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b3312b"/></marker><marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#96590a"/></marker><marker id="as" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" fill="#454c54"/></marker></defs><rect width="1100" height="560" rx="18" fill="#f6f5f1"/><text x="36" y="46" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#1b1f23" text-anchor="start">12 · Notifications</text><text x="36" y="70" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400" fill="#6a717a" text-anchor="start">Five events write in-app notifications in the same transaction as the event. Nothing leaves the system.</text><rect x="40" y="110" width="290" height="62" rx="12" fill="#e8edfc" stroke="#2b4acb" stroke-width="1.2"/><text x="54" y="134" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="680" fill="#2b4acb" text-anchor="start">Team message</text><text x="54" y="151" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">by: RBT or BCBA</text><path d="M330 141 L420 141" stroke="#6a717a" stroke-width="1.5" fill="none" marker-end="url(#a-muted)"/><text x="436" y="138" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#6a717a" text-anchor="start">to</text><text x="456" y="138" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#1b1f23" text-anchor="start">BCBA + assigned staff</text><rect x="40" y="186" width="290" height="62" rx="12" fill="#e8edfc" stroke="#2b4acb" stroke-width="1.2"/><text x="54" y="210" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="680" fill="#2b4acb" text-anchor="start">Message to family or teacher</text><text x="54" y="227" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">by: BCBA only</text><path d="M330 217 L420 217" stroke="#6a717a" stroke-width="1.5" fill="none" marker-end="url(#a-muted)"/><text x="436" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#6a717a" text-anchor="start">to</text><text x="456" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#1b1f23" text-anchor="start">guardians or teachers</text><rect x="40" y="262" width="290" height="62" rx="12" fill="#e2f3e9" stroke="#1d7a4b" stroke-width="1.2"/><text x="54" y="286" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="680" fill="#1d7a4b" text-anchor="start">Summary published</text><text x="54" y="303" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">by: BCBA</text><path d="M330 293 L420 293" stroke="#6a717a" stroke-width="1.5" fill="none" marker-end="url(#a-muted)"/><text x="436" y="290" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#6a717a" text-anchor="start">to</text><text x="456" y="290" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#1b1f23" text-anchor="start">guardians</text><rect x="40" y="338" width="290" height="62" rx="12" fill="#efe9fa" stroke="#6b46b0" stroke-width="1.2"/><text x="54" y="362" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="680" fill="#6b46b0" text-anchor="start">Message from home or class</text><text x="54" y="379" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">by: parent or teacher</text><path d="M330 369 L420 369" stroke="#6a717a" stroke-width="1.5" fill="none" marker-end="url(#a-muted)"/><text x="436" y="366" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#6a717a" text-anchor="start">to</text><text x="456" y="366" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#1b1f23" text-anchor="start">the student&#x27;s BCBA</text><rect x="40" y="414" width="290" height="62" rx="12" fill="#efe9fa" stroke="#6b46b0" stroke-width="1.2"/><text x="54" y="438" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="680" fill="#6b46b0" text-anchor="start">Home count recorded</text><text x="54" y="455" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">by: parent</text><path d="M330 445 L420 445" stroke="#6a717a" stroke-width="1.5" fill="none" marker-end="url(#a-muted)"/><text x="436" y="442" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#6a717a" text-anchor="start">to</text><text x="456" y="442" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#1b1f23" text-anchor="start">BCBA → review queue</text><rect x="700" y="110" width="364" height="128" rx="12" fill="#2b4acb" stroke="#2b4acb" stroke-width="1.2"/><text x="714" y="134" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="680" fill="#ffffff" text-anchor="start">Ctx.notify  ·  deps.py</text><text x="714" y="151" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#ffffff" text-anchor="start">one place; same transaction as the event</text><text x="714" y="168" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#ffffff" text-anchor="start">never notifies the sender</text><text x="714" y="185" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#ffffff" text-anchor="start">text carries first names only</text><text x="714" y="202" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#ffffff" text-anchor="start">link opens the right page for that role</text><rect x="700" y="262" width="364" height="92" rx="12" fill="#efe9fa" stroke="#6b46b0" stroke-width="1.2"/><text x="714" y="286" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="680" fill="#6b46b0" text-anchor="start">notifications table</text><text x="714" y="303" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">school_id + user_id · row-level security</text><text x="714" y="320" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">read_at set when the bell is opened</text><rect x="700" y="378" width="364" height="92" rx="12" fill="#e8edfc" stroke="#2b4acb" stroke-width="1.2"/><text x="714" y="402" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="680" fill="#2b4acb" text-anchor="start">Bell in the app shell</text><text x="714" y="419" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">asks every 60 s while the app is open</text><text x="714" y="436" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">unread count · click a row to go there</text><path d="M882 238 L882 262" stroke="#454c54" stroke-width="1.5" fill="none" marker-end="url(#a-ink2)"/><path d="M882 354 L882 378" stroke="#454c54" stroke-width="1.5" fill="none" marker-end="url(#a-ink2)"/><path d="M676 174 L700 174" stroke="#6a717a" stroke-width="1.5" fill="none" marker-end="url(#a-muted)"/><path d="M676 141 L676 445" stroke="#6a717a" stroke-width="1.5" fill="none"/><rect x="40" y="494" width="1024" height="44" rx="12" fill="#fae5e3" stroke="#b3312b" stroke-width="1.2"/><text x="54" y="518" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="680" fill="#b3312b" text-anchor="start">Not built: email, SMS and push. A parent sees a notification only after opening the app.</text></svg>