<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="1100" height="620" role="img"><defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6a717a"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b46b0"/></marker><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#59636b"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2b4acb"/></marker><marker id="a-ink2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#454c54"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d7a4b"/></marker><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d9d5cb"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b3312b"/></marker><marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#96590a"/></marker><marker id="as" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" fill="#454c54"/></marker></defs><rect width="1100" height="620" rx="18" fill="#f6f5f1"/><text x="36" y="46" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#1b1f23" text-anchor="start">6 · Security in depth</text><text x="36" y="70" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400" fill="#6a717a" text-anchor="start">A request passes four independent layers. Each one still holds if the layer before it has a bug.</text><rect x="60" y="104" width="760" height="92" rx="12" fill="#e8edfc" stroke="#2b4acb" stroke-width="1.2"/><text x="74" y="128" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="680" fill="#2b4acb" text-anchor="start">1  Browser</text><text x="250" y="128" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">•  httpOnly + SameSite=Strict cookies — no token readable by scripts</text><text x="250" y="145" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">•  Content-Security-Policy: default-src &#x27;self&#x27; · no third-party requests</text><text x="250" y="162" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">•  CSRF header on every change · 15-minute idle sign-out</text><text x="250" y="179" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">•  Device store encrypted (AES-GCM, non-extractable key)</text><path d="M40 150 L40 254" stroke="#6a717a" stroke-width="1.5" fill="none" marker-end="url(#a-muted)"/><rect x="60" y="208" width="760" height="92" rx="12" fill="#e2f3e9" stroke="#1d7a4b" stroke-width="1.2"/><text x="74" y="232" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="680" fill="#1d7a4b" text-anchor="start">2  API</text><text x="250" y="232" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">•  Argon2id passwords · 5 failures → 15-minute lock · sign-in throttle</text><text x="250" y="249" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">•  15-minute access token + rotating refresh; reuse revokes the chain</text><text x="250" y="266" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">•  Optional two-factor sign-in (authenticator app, recovery codes)</text><text x="250" y="283" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">•  One access module (deps.py): out-of-scope ids answer 404</text><path d="M40 254 L40 358" stroke="#6a717a" stroke-width="1.5" fill="none" marker-end="url(#a-muted)"/><rect x="60" y="312" width="760" height="92" rx="12" fill="#efe9fa" stroke="#6b46b0" stroke-width="1.2"/><text x="74" y="336" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="680" fill="#6b46b0" text-anchor="start">3  Database</text><text x="250" y="336" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">•  API connects as aba_app, never as owner</text><text x="250" y="353" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">•  Row-level security: a query without WHERE still sees one school</text><text x="250" y="370" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">•  System admins: counts only, zero student rows</text><text x="250" y="387" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">•  observations + audit_log: INSERT and SELECT only</text><path d="M40 358 L40 462" stroke="#6a717a" stroke-width="1.5" fill="none" marker-end="url(#a-muted)"/><rect x="60" y="416" width="760" height="92" rx="12" fill="#fbf0db" stroke="#96590a" stroke-width="1.2"/><text x="74" y="440" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="680" fill="#96590a" text-anchor="start">4  Accountability</text><text x="250" y="440" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">•  Audit log: sign-ins, record views, every change, takeovers</text><text x="250" y="457" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">•  Corrections keep the original and the reason</text><text x="250" y="474" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">•  Health page: row counts + write/read canary</text><text x="250" y="491" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">•  Tests assert each layer separately</text><text x="40" y="96" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#6a717a" text-anchor="middle">request</text><rect x="850" y="104" width="215" height="404" rx="16" fill="none" stroke="#b3312b" stroke-width="1.2" stroke-dasharray="5 5"/><text x="864" y="96" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#b3312b" text-anchor="start" letter-spacing="1.1">ENVIRONMENT GATES</text><rect x="868" y="124" width="180" height="80" rx="12" fill="#ffffff" stroke="#d9d5cb" stroke-width="1.2"/><text x="882" y="148" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="680" fill="#1b1f23" text-anchor="start">Persona sign-in</text><text x="882" y="165" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">Demo only;</text><text x="882" y="182" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">404 elsewhere</text><rect x="868" y="218" width="180" height="80" rx="12" fill="#ffffff" stroke="#d9d5cb" stroke-width="1.2"/><text x="882" y="242" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="680" fill="#1b1f23" text-anchor="start">Demo reset</text><text x="882" y="259" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">Demo / Dev / QA;</text><text x="882" y="276" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">routes absent in prod</text><rect x="868" y="312" width="180" height="80" rx="12" fill="#ffffff" stroke="#d9d5cb" stroke-width="1.2"/><text x="882" y="336" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="680" fill="#1b1f23" text-anchor="start">Test hooks, API docs</text><text x="882" y="353" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">not registered</text><text x="882" y="370" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">in prod</text><rect x="868" y="406" width="180" height="80" rx="12" fill="#ffffff" stroke="#d9d5cb" stroke-width="1.2"/><text x="882" y="430" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="680" fill="#1b1f23" text-anchor="start">AI and voice</text><text x="882" y="447" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">off per school; models</text><text x="882" y="464" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">on this machine only</text><rect x="60" y="528" width="1005" height="62" rx="12" fill="#fae5e3" stroke="#b3312b" stroke-width="1.2"/><text x="74" y="552" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="680" fill="#b3312b" text-anchor="start">Still required before real student data (deployment, not in this repo)</text><text x="74" y="569" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#454c54" text-anchor="start">TLS termination · disk encryption · backups and restore drill · enforced two-factor sign-in · counsel&#x27;s ruling on HIPAA vs FERPA</text></svg>