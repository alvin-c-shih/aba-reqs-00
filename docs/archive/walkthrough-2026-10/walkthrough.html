<title>ABA Phase 1 Walkthrough</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: three-column "clipboard" — step rail | live stage (device frame) | verify sheet. Ballpoint-blue ink on data-sheet paper. */
:root{
  --paper:#F4F6F3; --sheet:#FFFFFF; --ink:#1B2320; --muted:#5B6661; --rule:#D9DFDA; --rule-strong:#B9C2BC;
  --pen:#2343A8; --pen-soft:#E3E9FA; --hi:#FCE99A; --hi-ink:#5A4300;
  --ok:#1F7A4A; --ok-soft:#E1F2E8; --warn:#9A5B00; --warn-soft:#FBEFD9; --bad:#B4302A; --bad-soft:#F9E3E1;
  --env-demo:#6A3FA2; --env-dev:#1E7A46; --env-qa:#E5A126; --env-qa-ink:#2A1C00; --env-prod:#3A4642;
  --phone:#151A18; --shadow:0 1px 2px rgba(20,30,25,.06),0 8px 24px rgba(20,30,25,.08);
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif; --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111614; --sheet:#1A201E; --ink:#E6ECE8; --muted:#9BA7A1; --rule:#2C3532; --rule-strong:#3F4A46;
  --pen:#8EA6FF; --pen-soft:#22305C; --hi:#5C4B12; --hi-ink:#FCE99A;
  --ok:#5FCB8E; --ok-soft:#173326; --warn:#F0B35A; --warn-soft:#3A2B12; --bad:#FF8A80; --bad-soft:#3D1D1B;
  --env-demo:#8C62C9; --env-dev:#2E9A5E; --env-qa:#E5A126; --env-qa-ink:#2A1C00; --env-prod:#55625D;
  --phone:#050707; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111614; --sheet:#1A201E; --ink:#E6ECE8; --muted:#9BA7A1; --rule:#2C3532; --rule-strong:#3F4A46;
  --pen:#8EA6FF; --pen-soft:#22305C; --hi:#5C4B12; --hi-ink:#FCE99A;
  --ok:#5FCB8E; --ok-soft:#173326; --warn:#F0B35A; --warn-soft:#3A2B12; --bad:#FF8A80; --bad-soft:#3D1D1B;
  --env-demo:#8C62C9; --env-dev:#2E9A5E; --env-qa:#E5A126; --env-qa-ink:#2A1C00; --env-prod:#55625D;
  --phone:#050707; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 32px}
h1,h2,h3{font-family:var(--f-display);font-stretch:85%;text-wrap:balance;margin:0;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.tiny{font-size:12px}
code{font-family:var(--f-mono);font-size:.88em;background:var(--pen-soft);padding:0 4px;border-radius:3px}

/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:16px 12px;border-bottom:1px solid var(--rule)}
.top h1{font-size:22px;font-weight:800;letter-spacing:-.01em}
.top .sub{color:var(--muted);font-size:13px}
.top .grow{flex:1 1 200px;min-width:0}
.progress{display:flex;align-items:center;gap:10px;font-size:13px}
.progress .bar{width:140px;height:6px;background:var(--rule);border-radius:3px;overflow:hidden}
.progress .bar i{display:block;height:100%;background:var(--pen)}
.btn{border:1px solid var(--rule-strong);background:var(--sheet);border-radius:6px;padding:6px 12px;font-weight:600;font-size:14px;line-height:1.2}
.btn:hover{border-color:var(--pen)}
.btn.primary{background:var(--pen);border-color:var(--pen);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0E1530}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0E1530}}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--pen)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:3px 8px;font-size:13px}

/* layout */
.layout{display:grid;grid-template-columns:230px minmax(0,1fr) 340px;gap:20px;padding-top:16px;align-items:start}
@media (max-width:1180px){.layout{grid-template-columns:200px minmax(0,1fr)}.notes{grid-column:2}}
@media (max-width:780px){.notes{grid-column:1}}
@media (max-width:780px){.layout{grid-template-columns:minmax(0,1fr)}.rail{display:none}.rail-select{display:block!important}}
.rail{position:sticky;top:12px;font-size:13.5px;max-height:calc(100vh - 24px);overflow:auto;padding-right:4px}
.rail .act{font-family:var(--f-display);font-stretch:85%;font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:11.5px;color:var(--muted);margin:14px 0 4px}
.rail .act:first-child{margin-top:0}
.rail button{display:flex;gap:8px;width:100%;text-align:left;border:0;background:none;padding:5px 6px;border-radius:5px;align-items:baseline}
.rail button:hover{background:var(--pen-soft)}
.rail button.cur{background:var(--pen-soft);color:var(--pen);font-weight:700}
.rail .n{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);min-width:18px}
.rail .v{margin-left:auto;font-size:11px}
.rail-select{display:none;margin-top:12px}
.rail-select select{width:100%;padding:8px;border:1px solid var(--rule-strong);border-radius:6px;background:var(--sheet)}

/* stage */
.stage-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:10px}
.stage-head .eyebrow{font-family:var(--f-mono);font-size:12px;color:var(--pen);text-transform:uppercase;letter-spacing:.06em}
.stage-head h2{font-size:28px;font-weight:800;width:100%}
.lede{max-width:68ch;margin:0 0 14px;color:var(--ink)}
.stage{min-width:0}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}

/* frames */
.frame{background:var(--sheet);border:1px solid var(--rule-strong);border-radius:10px;overflow:hidden;box-shadow:var(--shadow);min-width:0}
.frame .chrome{display:flex;align-items:center;gap:6px;padding:7px 10px;border-bottom:1px solid var(--rule);font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.frame .chrome i{width:9px;height:9px;border-radius:50%;background:var(--rule-strong);display:inline-block}
.frame .chrome .url{margin-left:8px;background:var(--paper);padding:2px 8px;border-radius:4px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.web-body{padding:16px;min-height:300px}
.phones{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.phone{width:min(100%,350px);background:var(--phone);border-radius:30px;padding:10px;box-shadow:var(--shadow)}
.phone .screen{background:var(--sheet);border-radius:22px;overflow:hidden;min-height:600px;display:flex;flex-direction:column;position:relative}
.phone .owner{color:#C9D2CD;font-size:12px;text-align:center;padding:2px 0 8px;font-family:var(--f-mono)}
.statusbar{display:flex;justify-content:space-between;align-items:center;padding:6px 14px 4px;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.ph-body{padding:12px 14px 16px;flex:1;display:flex;flex-direction:column;gap:10px}

/* env banner */
.env{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;padding:7px 12px;font-family:var(--f-mono);font-size:12px;color:#fff;font-weight:500}
.env b{font-weight:700;letter-spacing:.05em}
.env.demo{background:var(--env-demo)} .env.dev{background:var(--env-dev)} .env.qa{background:var(--env-qa);color:var(--env-qa-ink)}
.env.prod{background:var(--env-prod);padding-block:3px;font-size:11px}
.env .sp{flex:1}
.phone .env{font-size:11px;padding:6px 12px;gap:2px 10px}

/* app ui pieces */
.app-nav{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--rule);margin:-16px -16px 14px;padding:8px 12px;background:var(--paper)}
.app-nav span{padding:4px 10px;border-radius:5px;font-size:13.5px;color:var(--muted)}
.app-nav span.on{background:var(--sheet);color:var(--ink);font-weight:700;box-shadow:inset 0 0 0 1px var(--rule)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;font-weight:700;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--rule-strong);padding:6px 8px}
table.t td{border-bottom:1px solid var(--rule);padding:6px 8px;vertical-align:top}
table.t td.num,table.t th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tscroll{overflow-x:auto}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field label{font-size:12.5px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--rule-strong);border-radius:6px;padding:7px 9px;background:var(--sheet);min-width:0;width:100%}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card{border:1px solid var(--rule);border-radius:8px;padding:12px;background:var(--sheet);min-width:0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--pen-soft);color:var(--pen)} .pill.neutral{background:var(--paper);color:var(--muted);box-shadow:inset 0 0 0 1px var(--rule)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--pen-soft);color:var(--pen);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.callout{border-left:3px solid var(--pen);background:var(--pen-soft);padding:8px 12px;border-radius:0 6px 6px 0;font-size:13.5px}
.callout.warn{border-color:var(--warn);background:var(--warn-soft)}
.callout.bad{border-color:var(--bad);background:var(--bad-soft)}
.callout.ok{border-color:var(--ok);background:var(--ok-soft)}
.undo-bar{display:flex;gap:6px;align-items:center;margin-left:auto}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:6px;font-size:14px;z-index:50;box-shadow:var(--shadow)}
.tempw{font-family:var(--f-mono);font-size:16px;background:var(--hi);color:var(--hi-ink);padding:4px 10px;border-radius:4px;letter-spacing:.04em}

/* mobile widgets */
.m-title{font-family:var(--f-display);font-stretch:85%;font-weight:800;font-size:19px}
.m-list button{display:flex;width:100%;gap:10px;align-items:center;text-align:left;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:10px;margin-bottom:8px}
.m-list button:hover{border-color:var(--pen)}
.bigbtn{border:0;border-radius:12px;padding:16px;font-size:18px;font-weight:800;font-family:var(--f-display);font-stretch:90%;color:#fff;width:100%;display:flex;justify-content:center;align-items:center;gap:8px;min-height:56px}
.b-correct{background:#1F7A4A} .b-incorrect{background:#B4302A} .b-prompted{background:#A86A00} .b-nr{background:#5C6762}
.b-pen{background:var(--pen)}
:root[data-theme="dark"] .b-pen{color:#0E1530}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .b-pen{color:#0E1530}}
.tri-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hist{display:flex;flex-wrap:wrap;gap:3px;min-height:26px;font-family:var(--f-mono);font-size:13px}
.hist span{width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;border-radius:4px;background:var(--paper);border:1px solid var(--rule)}
.hist span.c{color:#1F7A4A} .hist span.i{color:#B4302A} .hist span.p{color:#A86A00} .hist span.n{color:var(--muted)}
.hist span.void{text-decoration:line-through;opacity:.4}
.hist span.pend{outline:2px dashed var(--warn);outline-offset:-2px}
.target-card{border:2px solid var(--rule-strong);border-radius:12px;padding:12px;text-align:center}
.target-card .sd{font-size:22px;font-weight:800;font-family:var(--f-display);font-stretch:90%}
.tabs{display:flex;gap:4px;overflow-x:auto}
.tabs button{border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:4px 10px;font-size:12.5px;white-space:nowrap}
.tabs button.on{background:var(--pen);color:#fff;border-color:var(--pen)}
.counter{font-family:var(--f-mono);font-size:64px;font-weight:500;text-align:center;line-height:1}
.tap-area{border:2px dashed var(--pen);background:var(--pen-soft);color:var(--pen);border-radius:16px;min-height:150px;font-size:20px;font-weight:800;width:100%}
.lockbadge{font-size:11.5px;font-family:var(--f-mono);padding:4px 8px;border-radius:6px;background:var(--ok-soft);color:var(--ok)}
.lockbadge.lost{background:var(--warn-soft);color:var(--warn)}
.outbox{font-family:var(--f-mono);font-size:11.5px}
.overlay{position:absolute;inset:0;background:rgba(10,14,12,.72);display:flex;align-items:center;justify-content:center;padding:18px;z-index:5}
.overlay .card{width:100%}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.pinpad button{padding:12px;font-size:18px;border-radius:10px;border:1px solid var(--rule);background:var(--paper)}
.dots{display:flex;gap:10px;justify-content:center;margin:10px 0}
.dots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--pen)}
.dots i.f{background:var(--pen)}

/* tour */
.tour-wrap{position:relative}
.spot{position:relative;z-index:3;box-shadow:0 0 0 4px var(--hi),0 0 0 2000px rgba(10,14,12,.55);border-radius:6px}
.tour-tip{position:relative;z-index:4;margin-top:10px;background:var(--sheet);border:2px solid var(--pen);border-radius:8px;padding:12px;max-width:360px;box-shadow:var(--shadow)}
.tour-clip{overflow:hidden;border-radius:10px}

/* chart */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:10.5px}
.chart .grid line{stroke:var(--rule)}
.chart .axis{stroke:var(--rule-strong)}
.chart .path{fill:none;stroke:var(--pen);stroke-width:2}
.chart .pt{fill:var(--sheet);stroke:var(--pen);stroke-width:2}
.chart .pt.today{fill:var(--hi);stroke:var(--hi-ink)}
.chart .pt.corr{fill:var(--warn);stroke:var(--warn)}
.chart .phase{stroke:var(--ink);stroke-dasharray:4 3;stroke-width:1.2}
.chart .phase-l{fill:var(--ink);font-family:var(--f-body);font-weight:700;font-size:11px}
.chart .crit{stroke:var(--ok);stroke-dasharray:2 3}
.chart .bar{fill:var(--pen);opacity:.85}
.chart .bar.base{fill:var(--muted);opacity:.6}
.chart .bar.today{fill:var(--hi-ink)}

/* notes */
.notes{position:sticky;top:12px;display:flex;flex-direction:column;gap:14px;min-width:0}
@media (max-width:1180px){.notes{position:static}}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:14px;min-width:0}
.sheet h3{font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;font-stretch:80%}
.checks{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.checks li{display:flex;gap:8px;align-items:flex-start}
.checks input{margin-top:4px;accent-color:var(--pen)}
.dec{border:1px solid var(--warn);background:var(--warn-soft);border-radius:8px;padding:8px 10px;font-size:13.5px}
.dec + .dec{margin-top:6px}
.dec b{font-family:var(--f-mono);color:var(--warn)}
.spec{font-size:12.5px;color:var(--muted)}
.verdicts{display:flex;gap:6px;flex-wrap:wrap}
.verdicts button{flex:1 1 80px;border:1px solid var(--rule-strong);background:var(--sheet);border-radius:6px;padding:6px;font-weight:700;font-size:13px}
.verdicts button.on.pass{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.verdicts button.on.concern{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.verdicts button.on.fail{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.others{font-size:12.5px;display:flex;flex-direction:column;gap:4px;margin-top:8px}
.dbi table{font-size:12.5px}
.dbi td,.dbi th{padding:3px 6px!important}
.delta{color:var(--ok);font-weight:700}
.flash{background:var(--hi);color:var(--hi-ink)}
details summary{cursor:pointer;font-weight:700}
.report{--ok:#1F7A4A;--ok-soft:#E1F2E8;--warn:#9A5B00;--warn-soft:#FBEFD9;--bad:#B4302A;--bad-soft:#F9E3E1;--pen:#2343A8;--pen-soft:#E3E9FA;--muted:#5B6661;--ink:#1B2320;--sheet:#fff;--paper:#F4F6F3;--rule:#E1E5E2;--rule-strong:#B9C2BC;--hi:#FCE99A;--hi-ink:#5A4300;background:#fff;color:#1B2320;border:1px solid var(--rule-strong);border-radius:4px;padding:22px;max-width:720px;box-shadow:var(--shadow)}
.report h3{font-size:20px}
.report .chart text{fill:#5B6661}
.report .chart .path{stroke:#2343A8}
.report .chart .pt{fill:#fff;stroke:#2343A8}
.report .chart .phase{stroke:#1B2320} .report .chart .phase-l{fill:#1B2320}
.report .chart .grid line{stroke:#E1E5E2}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top">
  <div class="grow">
    <h1>ABA Phase 1 Walkthrough</h1>
    <div class="sub">A clickable, linear tour of every Phase 1 capability. Runs on fake demo data in your browser. Nothing here touches real records.</div>
  </div>
  <div class="progress"><span id="prog-label" class="mono">1 / 20</span><span class="bar"><i id="prog-bar"></i></span></div>
  <button class="btn" id="reset-btn" data-act="resetAll">Reset walkthrough</button>
</header>

<div class="rail-select"><label class="tiny muted" for="step-select">Step</label><select id="step-select"></select></div>

<main class="layout">
  <nav class="rail" id="rail" aria-label="Walkthrough steps"></nav>
  <section class="stage" id="stage-col">
    <div class="stage-head"><span class="eyebrow" id="st-eyebrow"></span><h2 id="st-title"></h2></div>
    <p class="lede" id="st-lede"></p>
    <div id="stage"></div>
    <div class="navrow">
      <button class="btn" data-act="prev" id="prev-btn">← Previous</button>
      <button class="btn primary" data-act="next" id="next-btn">Next step →</button>
    </div>
  </section>
  <aside class="notes" id="notes">
    <div class="sheet" id="verify-sheet"></div>
    <div class="sheet" id="signoff-sheet"></div>
    <div class="sheet dbi" id="db-sheet"></div>
  </aside>
</main>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
/* ============================================================
   Utilities
   ============================================================ */
const $ = (s, el = document) => el.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = (p = "") => p + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
const DAY = 864e5, MIN = 6e4;
const fmtDate = (t) => new Date(t).toLocaleDateString(undefined, { month: "short", day: "numeric" });
const fmtTime = (t) => new Date(t).toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
const fmtStamp = (t) => { const d = new Date(t); const p = n => String(n).padStart(2, "0"); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; };
const mmss = (s) => `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const initials = (n) => n.split(/\s+/).filter(Boolean).map(w => w[0]).join("").slice(0, 2).toUpperCase();
/* A void is active unless it was itself voided ("Restore"). */
function activeVoids(list) {
  const voids = list.filter(o => o.kind === "void"); const ids = new Set(voids.map(v => v.id));
  const cancelled = new Set(voids.filter(v => ids.has(v.ref_id)).map(v => v.ref_id));

   Analytics (computed from the append-only observation log)
   ============================================================ */
function sessionValue(pid, sid) {
  const p = program(pid);
  const obs = DB.observations.filter(o => o.session_id === sid && o.program_id === pid && o.review_state !== "pending" && o.review_state !== "rejected");
  const voided = activeVoids(obs);
  const live = obs.filter(o => o.kind !== "void" && !voided.has(o.id));
  const corr = DB.corrections.filter(c => c.session_id === sid && c.program_id === pid).sort((a, b) => b.at - a.at)[0];
  let value = null, n = 0, extra = {};
  if (p.method === "trial") {
    const tr = live.filter(o => o.kind === "trial"); n = tr.length;
    const k = { correct: 0, prompted: 0, incorrect: 0, no_response: 0 }; tr.forEach(o => k[o.value]++);
    extra = k; value = n ? Math.round(100 * k.correct / n) : null;
  } else if (p.method === "frequency") { n = live.filter(o => o.kind === "event").length; value = n; }
  else { const ds = live.filter(o => o.kind === "duration"); n = ds.length; value = Math.round(ds.reduce((a, o) => a + o.value, 0) / 6) / 10; }
  const original = value;

  return { value, n, extra, corrected: !!corr, original, corr };
}
function phasesFor(pid) { return DB.phases.filter(p => p.program_id === pid).sort((a, b) => a.start_at - b.start_at); }
function series(pid) {
  const ph = phasesFor(pid);

    const v = sessionValue(pid, s.id); let phase = null; ph.forEach(p => { if (p.start_at <= s.start) phase = p; });
    return Object.assign({ session: s, t: s.start, phase }, v);
  }).filter(r => r.value !== null && (program(pid).method !== "trial" || r.n > 0));
}
function slopePerWeek(rows) {
  if (rows.length < 2) return 0; const xs = rows.map(r => r.t / (7 * DAY)), ys = rows.map(r => r.value);
  const mx = xs.reduce((a, b) => a + b) / xs.length, my = ys.reduce((a, b) => a + b) / ys.length;
  let num = 0, den = 0; xs.forEach((x, i) => { num += (x - mx) * (ys[i] - my); den += (x - mx) ** 2; }); return den ? num / den : 0;
}
function programStatus(pid) {
  const p = program(pid), rows = series(pid);
  if (!rows.length) return { code: "nodata", label: "No data yet", tone: "neutral", why: "No sessions recorded for this program." };
  const cur = rows[rows.length - 1].phase; const inPh = rows.filter(r => r.phase === cur);
  const mean = inPh.reduce((a, r) => a + r.value, 0) / inPh.length; const slope = slopePerWeek(inPh);
  const unit = p.method === "trial" ? "pts" : p.method === "frequency" ? "/session" : "min";
  if (cur && cur.kind === "baseline") return { code: "baseline", label: "Baseline", tone: "info", why: `${inPh.length} baseline session${inPh.length === 1 ? "" : "s"}. No intervention phase yet.` };
  if (p.method === "trial" && p.mastery) {
    const m = p.mastery, last = inPh.slice(-m.m);
    const hits = last.filter(r => r.value >= m.threshold && r.n >= m.minTrials).length;
    if (last.length >= m.m && hits >= m.n) return { code: "mastered", label: "Mastered", tone: "ok", why: `Met the rule: ≥${m.threshold}% independent in ${m.n} of the last ${m.m} sessions (≥${m.minTrials} trials each).` };
  }
  if (p.goal === "reduce") {
    if (inPh.length >= 4 && slope < -0.1 * Math.max(1, mean)) return { code: "improving", label: "Decreasing", tone: "ok", why: `Trend ${slope.toFixed(1)} ${unit}/week in “${cur.label}”. Behavior is going down.` };
    if (inPh.length >= 6 && slope > 0) return { code: "worse", label: "Increasing", tone: "bad", why: `Trend +${slope.toFixed(1)} ${unit}/week. Behavior is going up.` };
    return { code: "ontrack", label: "Monitoring", tone: "neutral", why: `${inPh.length} sessions in phase.` };
  }
  if (inPh.length >= 6) {
    const best = Math.max(...inPh.slice(0, -3).map((r, i, a) => i <= a.length - 3 ? (a[i].value + a[i + 1].value + a[i + 2].value) / 3 : -1));

    if (best - last3 >= 15) return { code: "regression", label: "Regression", tone: "bad", why: `Last 3 sessions average ${Math.round(last3)}%, ${Math.round(best - last3)} pts below this phase's best 3-session run (${Math.round(best)}%). Rule: drop ≥15 pts.` };

  }
  return { code: "ontrack", label: "Progressing", tone: "ok", why: `Trend ${slope >= 0 ? "+" : ""}${slope.toFixed(1)} ${unit}/week in “${cur?.label ?? "current phase"}”.` };
}

/* ============================================================
   Chart (inline SVG). Data paths break at phase lines.
   ============================================================ */
function chartSVG(pid, opts = {}) {
  const p = program(pid), rows = series(pid).slice(-(opts.last || 999));
  const W = opts.w || 640, H = opts.h || 240, L = 40, R = 12, T = 26, B = 30;
  if (!rows.length) return `<p class="muted">No sessions yet.</p>`;
  const isPct = p.method === "trial";
  const maxV = isPct ? 100 : Math.max(4, Math.ceil(Math.max(...rows.map(r => r.value)) * 1.15));
  const x = (i) => L + (rows.length === 1 ? (W - L - R) / 2 : i * (W - L - R) / (rows.length - 1));
  const y = (v) => T + (H - T - B) * (1 - v / maxV);
  const ticks = isPct ? [0, 20, 40, 60, 80, 100] : [0, .25, .5, .75, 1].map(f => Math.round(maxV * f * 10) / 10);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(p.name)} graph">`;
  s += `<g class="grid">${ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L - 6}" y="${y(t) + 3}" text-anchor="end">${t}${isPct ? "%" : ""}</text>`).join("")}</g>`;
  s += `<line class="axis" x1="${L}" x2="${L}" y1="${T}" y2="${H - B}"/><line class="axis" x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}"/>`;
  if (isPct && p.mastery && !opts.bar) s += `<line class="crit" x1="${L}" x2="${W - R}" y1="${y(p.mastery.threshold)}" y2="${y(p.mastery.threshold)}"/><text x="${L + 4}" y="${y(p.mastery.threshold) - 4}" style="fill:var(--ok)">criterion ${p.mastery.threshold}%</text>`;
  const step = Math.max(1, Math.ceil(rows.length / 7));
  rows.forEach((r, i) => { if (i % step === 0 || i === rows.length - 1) s += `<text x="${x(i)}" y="${H - B + 14}" text-anchor="middle">${fmtDate(r.t)}</text>`; });
  s += `<text x="${L}" y="${H - 2}">sessions →</text>`;
  // phase lines between sessions
  for (let i = 1; i < rows.length; i++) if (rows[i].phase !== rows[i - 1].phase && rows[i].phase) {
    const px = (x(i) + x(i - 1)) / 2; const nearEnd = px > W - R - 120; s += `<line class="phase" x1="${px}" x2="${px}" y1="${T - 8}" y2="${H - B}"/><text class="phase-l" x="${nearEnd ? px - 4 : px + 4}" y="${T - 12}" text-anchor="${nearEnd ? "end" : "start"}">${esc(rows[i].phase.label)}</text>`;
  }
  if (rows[0].phase) s += `<text class="phase-l" x="${L + 4}" y="${T - 12}">${esc(rows[0].phase.label)}</text>`;
  if (opts.bar) {
    const bw = Math.max(3, Math.min(26, (W - L - R) / rows.length * .65));
    rows.forEach((r, i) => s += `<rect class="bar ${r.phase?.kind === "baseline" ? "base" : ""} ${opts.highlight === r.session.id ? "today" : ""}" x="${x(i) - bw / 2}" y="${y(r.value)}" width="${bw}" height="${Math.max(0, H - B - y(r.value))}"><title>${fmtDate(r.t)}: ${r.value}</title></rect>`);
  } else {
    let seg = [];
    const flush = () => { if (seg.length > 1) s += `<polyline class="path" points="${seg.join(" ")}"/>`; seg = []; };
    rows.forEach((r, i) => { if (i && r.phase !== rows[i - 1].phase) flush(); seg.push(`${x(i)},${y(r.value)}`); }); flush();
    rows.forEach((r, i) => s += `<circle class="pt ${r.corrected ? "corr" : ""} ${opts.highlight === r.session.id ? "today" : ""}" cx="${x(i)}" cy="${y(r.value)}" r="${opts.highlight === r.session.id ? 6 : 4}"><title>${fmtDate(r.t)}: ${r.value}${isPct ? "%" : ""}${r.corrected ? " (corrected)" : ""}</title></circle>`);
  }
  return s + `</svg>`;
}

    if (curLock && o.lock_epoch !== curLock.epoch && o.recorded_at > curLock.acquired_at) state = "pending";
    insert("observations", Object.assign({}, o, { review_state: state, received_at: Date.now() }));
    if (state === "pending") pending++;

  if (pending) {

    insert("review_items", { id: uid("rv_"), session_id: d.session, student_id: sess?.student_id, device_id: d.id, user_id: d.user, count: pending, status: "open", created_at: Date.now() });
    audit("observations_quarantined", "session:" + d.session, `${pending} observations recorded after lock moved`);
  }
  const dev = DB.devices.find(x => x.id === d.id); if (dev) { dev.last_sync = Date.now(); touch("devices"); }
  const n = d.outbox.length; d.outbox = []; void lock; return n;
}
function receipt(dk) {
  const d = S.devices[dk]; if (!d.session) return "";
  const mine = d.local.filter(o => o.session_id === d.session);
  const confirmed = mine.filter(o => DB.observations.some(x => x.id === o.id)).length;
  const pend = DB.observations.filter(x => x.session_id === d.session && x.device_id === d.id && x.review_state === "pending").length;
  return `<span class="outbox ${confirmed === mine.length ? "" : ""}" data-testid="sync-receipt">Server confirmed <b>${confirmed}/${mine.length}</b>${pend ? ` · <span style="color:var(--warn)">${pend} awaiting BCBA review</span>` : ""}</span>`;
}
function acquireLock(dk, studentId, force) {
  const d = S.devices[dk]; const now = Date.now();
  let sess = DB.sessions.find(s => s.student_id === studentId && s.status === "active");
  let lock = sess && DB.session_locks.find(l => l.session_id === sess.id);
  if (lock && lock.device_id === d.id) { d.session = sess.id; d.epoch = lock.epoch; d.view = "collect"; d.tab = d.tab || sess.program_ids[0]; return { ok: true }; }
  if (lock && !force) return { held: lock };
  if (!sess) {
    const progs = DB.programs.filter(p => p.student_id === studentId && p.active).map(p => p.id);
    sess = insert("sessions", { id: uid("se_"), student_id: studentId, rbt_id: d.user, start: now, end: null, program_ids: progs, status: "active", type: "direct", notes: "", handoffs: [] });
    audit("session_started", "session:" + sess.id, `${user(d.user).name} on ${d.id}`);
  }
  if (lock) {
    const prev = lock.user_id; lock.epoch += 1; lock.user_id = d.user; lock.device_id = d.id; lock.acquired_at = now; lock.heartbeat_at = now; touch("session_locks");
    sess.handoffs.push({ at: now, from: prev, to: d.user });
    audit("session_lock_taken_over", "session:" + sess.id, `${user(prev).name} → ${user(d.user).name} (epoch ${lock.epoch})`);
  } else {
    lock = insert("session_locks", { id: uid("lk_"), session_id: sess.id, student_id: studentId, user_id: d.user, device_id: d.id, epoch: 1, acquired_at: now, heartbeat_at: now });
    audit("session_lock_acquired", "session:" + sess.id, `${user(d.user).name} (epoch 1)`);
  }
  d.session = sess.id; d.epoch = lock.epoch; d.view = "collect"; d.tab = d.tab || sess.program_ids[0]; d.lostLockNotice = null;
  return { ok: true };
}
function lockState(dk) {
  const d = S.devices[dk]; if (!d.session) return null;
  const lock = DB.session_locks.find(l => l.session_id === d.session);
  if (!lock) return { mine: false, released: true };
  return { mine: lock.device_id === d.id && lock.epoch === d.epoch, lock };
}

function collectScreen(dk) {
  const d = S.devices[dk]; const sess = DB.sessions.find(s => s.id === d.session); const ls = lockState(dk);
  const elapsed = (Date.now() - sess.start) / 1000;
  const pid = d.tab; const p = program(pid);
  const mine = d.local.filter(o => o.session_id === d.session && o.program_id === pid);
  const voided = activeVoids(d.local);
  const serverPending = new Set(DB.observations.filter(o => o.review_state === "pending").map(o => o.id));
  const lost = ls && !ls.mine && d.online;
  let body = "";
  if (p.method === "trial") {
    const tgs = DB.targets.filter(t => t.program_id === pid && t.active);
    const trials = mine.filter(o => o.kind === "trial" && !voided.has(o.id));
    const tg = tgs[trials.length % Math.max(1, tgs.length)];
    const c = trials.filter(o => o.value === "correct").length;
    body = `<div class="target-card"><div class="tiny muted" data-testid="current-trial">Trial ${trials.length + 1} · Target</div><div class="sd">${esc(tg ? tg.sd : "—")}</div></div>

    <button class="bigbtn b-prompted" data-act="mTrial" data-arg="${dk}:prompted" data-testid="trial-prompted-btn" ${lost ? "disabled" : ""}>◐ Prompted</button><button class="bigbtn b-nr" data-act="mTrial" data-arg="${dk}:no_response" data-testid="trial-no-response-btn" ${lost ? "disabled" : ""}>○ No resp.</button></div>
    <div class="hist" data-testid="trial-history">${mine.filter(o => o.kind === "trial").slice(-20).map(o => `<span class="${{ correct: "c", incorrect: "i", prompted: "p", no_response: "n" }[o.value]} ${voided.has(o.id) ? "void" : ""} ${serverPending.has(o.id) ? "pend" : ""}" title="${o.value}">${{ correct: "✓", incorrect: "✗", prompted: "◐", no_response: "○" }[o.value]}</span>`).join("")}</div>
    <div class="row tiny" data-testid="trial-summary"><span><b class="mono">${trials.length}</b> trials</span><span>·</span><span><b class="mono">${trials.length ? Math.round(100 * c / trials.length) : 0}%</b> independent correct</span></div>`;
  } else if (p.method === "frequency") {
    const ev = mine.filter(o => o.kind === "event" && !voided.has(o.id));
    body = `<div class="counter" data-testid="frequency-counter">${ev.length}</div><div class="tiny muted" style="text-align:center">${(ev.length / Math.max(1, elapsed / 60)).toFixed(2)} per minute</div>
    <button class="tap-area" data-act="mEvent" data-arg="${dk}" data-testid="frequency-tap-area" ${lost ? "disabled" : ""}>Tap each time<br>“${esc(p.name)}” occurs</button>`;
  } else {
    const run = d.running && d.running.pid === pid ? d.running : null;
    const ds = mine.filter(o => o.kind === "duration" && !voided.has(o.id));
    body = `<div class="counter" data-testid="duration-timer" ${run ? "data-run=" + run.start : ""}>${run ? mmss((Date.now() - run.start) / 1000) : "00:00"}</div>
    <button class="bigbtn ${run ? "b-incorrect" : "b-pen"}" data-act="mDur" data-arg="${dk}" data-testid="${run ? "stop" : "start"}-duration-btn" ${lost ? "disabled" : ""}>${run ? "■ Stop episode" : "▶ Start episode"}</button>
    <div class="tiny" data-testid="duration-list">${ds.map((o, i) => `Episode ${i + 1}: <span class="mono">${mmss(o.value)}</span>`).join("<br>") || "<span class='muted'>No episodes yet</span>"}</div>
    <div class="tiny" data-testid="total-duration">Total: <b class="mono">${mmss(ds.reduce((a, o) => a + o.value, 0))}</b></div>`;
  }
  const canVoid = mine.some(o => o.kind !== "void" && !voided.has(o.id));
  return `<div class="row" style="justify-content:space-between"><div class="m-title">${esc(student(sess.student_id).name)}</div><span class="mono tiny" data-testid="session-timer" data-since="${sess.start}">⏱ ${mmss(elapsed)}</span></div>
  ${lost ? `<div class="callout warn" data-testid="lock-stolen-banner"><b>${esc(user(ls.lock.user_id).name)} took over this session at ${fmtTime(ls.lock.acquired_at)}.</b> Everything you recorded after that is saved and has been sent to the BCBA for review. To keep recording here, take the session back.</div><button class="btn" data-act="mTakeback" data-arg="${dk}">Take session back</button>` : `<span class="lockbadge ${ls && ls.mine ? "" : "lost"}">${d.online ? (ls && ls.mine ? `You hold this session · epoch ${d.epoch}` : "Lock status unknown") : `Offline · holding lock from epoch ${d.epoch}`}</span>`}
  <div class="tabs">${sess.program_ids.map(id => `<button class="${id === pid ? "on" : ""}" data-act="mTab" data-arg="${dk}:${id}">${esc(program(id).name)}</button>`).join("")}</div>

{ id: "takeover", act: "Offline & handoff", title: "A colleague takes over",

/* ---------------- Review & analysis ---------------- */
{ id: "review", act: "Review & analysis", title: "Review data recorded without the lock",
  lede: "Priya sees one review item: observations Jordan recorded after Sam took over. She can accept them (they count in graphs) or reject them with a reason (kept, but hidden). Either way the decision is audited.",
  enter() { S.actor = "u_bcba"; ensureReviewItem(); },
  render() {
    const items = DB.review_items;
    const f = formHist("reject", { reason: "" });
    return web("/bcba/review", "u_bcba", `<h3 style="font-size:18px">Review queue</h3>

/* helpers that let any step be visited directly */
function ensureSam() {

    audit("user_created", "user:u_sam", "Sam Ortiz (RBT) · auto-created because step 4 was skipped");
  }
}
function ensureNewProgram() {
  if (S.ui.newProgram && program(S.ui.newProgram)) return;
  const id = "p_dee_colors"; if (!program(id)) {
    insert("programs", { id, student_id: "s_dee", plan_id: "tp_s_dee", name: "Receptive ID — Colors", method: "trial", goal: "acquire", version: 1, active: true, mastery: { threshold: 80, n: 3, m: 3, minTrials: 10, promptedCounts: "not_independent" }, created_at: Date.now() });
    insert("program_versions", { id: uid("pv_"), program_id: id, version: 1, at: Date.now(), by: "u_bcba", reason: "Initial version" });
    ["Red", "Blue", "Yellow"].forEach((sd, i) => insert("targets", { id: `${id}_t${i}`, program_id: id, sd, order: i, active: true }));
    insert("phases", { id: uid("ph_"), program_id: id, label: "Baseline", kind: "baseline", start_at: Date.now() - MIN, by: "u_bcba" });
  }
  S.ui.newProgram = id;
}
function ensureSession(dk, forB) {
  ensureSam(); ensureNewProgram();
  const d = S.devices[dk];
  if (forB) { S.devices.B.user = "u_sam"; if (!d.session) { acquireLock("B", "s_dee", true); } if (d.view === "list" || d.view === "held") d.view = "collect"; return; }
  if (!d.session) { const r = acquireLock(dk, "s_dee", true); void r; }
}
function ensureReviewItem() {
  if (DB.review_items.length) return;
  // visitor skipped the handoff steps: simulate them so the queue has an example
  ensureSession("A"); const A = S.devices.A; A.online = false;
  const sess = DB.sessions.find(s => s.id === A.session);
  const pid = sess.program_ids.find(id => program(id).method === "trial");
  S.devices.B.user = "u_sam"; acquireLock("B", "s_dee", true);
  ["correct", "prompted", "correct"].forEach(v => deviceRecord("A", { program_id: pid, kind: "trial", value: v, target_id: DB.targets.find(t => t.program_id === pid).id, recorded_at: Date.now() + 1000 }));
  A.online = true; flush("A");
}

  mPick(arg) { const [dk, sid] = arg.split(":"); const d = S.devices[dk]; d.pickStudent = sid; const r = acquireLock(dk, sid, false); if (r.held) d.view = "held"; },

  mTakeback(dk) { const d = S.devices[dk]; const sess = DB.sessions.find(s => s.id === d.session); d.pickStudent = sess.student_id; d.view = "held"; },
  mTab(arg) { const [dk, pid] = arg.split(":"); S.devices[dk].tab = pid; },
  mTrial(arg) { const [dk, v] = arg.split(":"); const d = S.devices[dk]; const pid = d.tab; const tgs = DB.targets.filter(t => t.program_id === pid && t.active);
    const voided = activeVoids(d.local); const n = d.local.filter(o => o.session_id === d.session && o.program_id === pid && o.kind === "trial" && !voided.has(o.id)).length;

  mVoid(dk) { const d = S.devices[dk]; const voided = activeVoids(d.local);
    const last = d.local.filter(o => o.session_id === d.session && o.program_id === d.tab && o.kind !== "void" && !voided.has(o.id)).pop(); if (!last) return;
    const v = deviceRecord(dk, { program_id: d.tab, kind: "void", ref_id: last.id }); d.redo.push(v.id); toast("Marked as a mistake. Still in the record."); },
  mRedo(dk) { const d = S.devices[dk]; const vid = d.redo.pop(); const v = d.local.find(o => o.id === vid); if (!v) return; deviceRecord(dk, { program_id: v.program_id, kind: "void", ref_id: v.id }); toast("Restored"); },
  // restoring = voiding the void

  mResume(dk) { S.devices[dk].view = "collect"; },
  mConfirmEnd(dk) { const d = S.devices[dk]; flush(dk); const sess = DB.sessions.find(s => s.id === d.session); sess.status = "completed"; sess.end = Date.now(); sess.notes = S.forms["endnote_" + dk]?.vals.note || ""; touch("sessions");
    DB.session_locks = DB.session_locks.filter(l => l.session_id !== sess.id); touch("session_locks"); audit("session_completed", "session:" + sess.id, `by ${user(d.user).name} · lock released`);
    d.lastSession = sess.id; d.view = "graph"; d.graphPid = sess.program_ids.find(id => program(id).method === "frequency") || sess.program_ids[0]; delete S.forms["endnote_" + dk];
    Object.values(S.devices).forEach(x => { if (x.session === sess.id && x !== d) { x.view = "list"; x.session = null; } }); d.session = sess.id; },
  mGraphTab(arg) { const [dk, pid] = arg.split(":"); S.devices[dk].graphPid = pid; },
  mHome(dk) { const d = S.devices[dk]; d.view = "list"; d.session = null; d.epoch = null; },
  toggleWifi(dk) { const d = S.devices[dk]; d.online = !d.online; if (d.online) { const n = flush(dk); toast(n ? `Synced ${n} item${n === 1 ? "" : "s"}` : "Online"); const ls = lockState(dk); if (ls && !ls.mine) audit("lock_loss_notified", "device:" + d.id, "banner shown to " + user(d.user).name); } },
  idle(dk) { S.devices[dk].pinLocked = true; S.devices[dk].pin = ""; },
  pin(arg) { const [dk, k] = arg.split(":"); const d = S.devices[dk]; if (k === "⌫") d.pin = d.pin.slice(0, -1); else if (d.pin.length < 4) d.pin += k; if (d.pin.length === 4) { if (d.pin === "1234") { d.pinLocked = false; toast("Unlocked. Session still running."); } else { d.pin = ""; toast("Wrong PIN. Try 1234."); } } },
  reviewAccept(id) { const it = DB.review_items.find(x => x.id === id); DB.observations.forEach(o => { if (o.session_id === it.session_id && o.device_id === it.device_id && o.review_state === "pending") o.review_state = "accepted"; }); it.status = "accepted"; it.decided_by = "u_bcba"; it.decided_at = Date.now(); touch("review_items"); touch("observations"); audit("review_accepted", "review:" + id, `${it.count} observations now count`); },
  reviewReject(id) { const it = DB.review_items.find(x => x.id === id); const reason = S.forms.reject.vals.reason.trim(); DB.observations.forEach(o => { if (o.session_id === it.session_id && o.device_id === it.device_id && o.review_state === "pending") o.review_state = "rejected"; }); it.status = "rejected"; it.reason = reason; it.decided_by = "u_bcba"; it.decided_at = Date.now(); touch("review_items"); audit("review_rejected", "review:" + id, reason); delete S.forms.reject; },
  gType(t) { S.ui.gBar = t === "bar"; },
  addPhase() { const pid = S.ui.gProg; const rows = series(pid); const sid = S.ui.phBefore || rows[rows.length - 3]?.session.id; const s = DB.sessions.find(x => x.id === sid); if (!s) return; const label = (S.ui.phName ?? "Added visual schedule").trim() || "New phase";
    insert("phases", { id: uid("ph_"), program_id: pid, label, kind: "intervention", start_at: s.start - MIN, by: "u_bcba" }); audit("phase_added", "program:" + pid, `“${label}” before ${fmtDate(s.start)}`); },
  pickCorr(sid) { S.ui.corrSession = sid; delete S.forms.corr; },
  saveCorr(sid) { const v = S.forms.corr.vals; const before = sessionValue("p_ben_mand", sid).value; insert("corrections", { id: uid("co_"), session_id: sid, program_id: "p_ben_mand", new_value: +v.value, reason: v.reason.trim(), by: "u_bcba", at: Date.now() }); audit("data_corrected", "session:" + sid, `Manding count ${before} → ${v.value}: ${v.reason.trim()}`); delete S.forms.corr; },
  genReport() { const id = uid("job_"); S.ui.report = { id, state: "running" }; insert("reports", { id, type: "progress", student_id: "s_ava", status: "processing", by: "u_bcba", at: Date.now() }); audit("report_requested", "student:s_ava", "progress · last 30 days");
    setTimeout(() => { const r = DB.reports.find(x => x.id === id); if (!r) return; r.status = "completed"; touch("reports"); S.ui.report = { id, state: "done", at: Date.now() }; audit("report_completed", "report:" + id, "PDF ready"); render(); }, 1400); },
  copySummary() { const md = summaryMarkdown(); const ta = $("#summary-md"); navigator.clipboard?.writeText(md).then(() => toast("Copied sign-off summary"), () => { ta.hidden = false; ta.value = md; ta.select(); toast("Select all and copy"); }) ?? (ta.hidden = false, ta.value = md); return false; },
  verdict(v) { setVerdict(STEPS[S.step].id, v); return false; },
  saveNote() { const n = $("#so-note").value; setVerdict(STEPS[S.step].id, SO.mine[STEPS[S.step].id]?.v || "concern", n); return false; },
};

/* ============================================================
   Sign-off (shared via artifact db when available)
   ============================================================ */
const SO = { mine: {}, all: {}, names: {}, db: null, me: null, users: null, mode: "local" };
const LS_KEY = "aba-walkthrough-signoff";
function lsGet() { try { return JSON.parse(localStorage.getItem(LS_KEY) || "{}"); } catch { return {}; } }
function lsSet(v) { try { localStorage.setItem(LS_KEY, JSON.stringify(v)); } catch { } }
const verdictPill = (v) => `<span class="pill ${v === "pass" ? "ok" : v === "concern" ? "warn" : "bad"}">${v === "pass" ? "Pass" : v === "concern" ? "Concern" : "Fail"}</span>`;
function aggregate(stepId) {
  const c = { pass: 0, concern: 0, fail: 0 }; let any = false;
  Object.values(SO.all).forEach(doc => { const s = doc?.steps?.[stepId]; if (s) { c[s.v]++; any = true; } });
  if (!any) return ""; return [c.pass && `${c.pass} pass`, c.concern && `${c.concern} concern`, c.fail && `${c.fail} fail`].filter(Boolean).join(" · ");
}
let soWriting = Promise.resolve();
function setVerdict(stepId, v, note) {
  const prev = SO.mine[stepId] || {};
  SO.mine[stepId] = { v, note: note ?? prev.note ?? "", at: Date.now() };
  if (SO.mode === "shared" && SO.db && SO.me) {
    const payload = { steps: structuredClone(SO.mine), updated_at: Date.now() };
    soWriting = soWriting.then(() => SO.db.collection("signoffs").doc(SO.me).set(payload)).catch(() => { toast("Couldn't save to the shared sign-off. Kept in this browser."); lsSet(SO.mine); });
  } else lsSet(SO.mine);
  renderNotes(); renderRail();
}
async function initShared() {
  SO.mine = lsGet();
  try {
    if (!window.claude?.use) return;
    const [db, users] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !users) return;
    const me = await users.id(); if (!me) return;
    SO.db = db; SO.users = users; SO.me = me; SO.mode = "shared";
    const own = await db.collection("signoffs").doc(me).get();
    if (own.exists) SO.mine = Object.assign({}, lsGet(), own.data().steps || {});
    db.collection("signoffs").onSnapshot(async snap => {
      SO.all = {}; snap.docs.forEach(d => SO.all[d.id] = d.data());
      try { const ps = await users.profiles(Object.keys(SO.all)); Object.entries(ps).forEach(([id, p]) => SO.names[id] = p.name || "Someone"); } catch { }
      renderNotes(); renderRail(); if (STEPS[S.step].id === "audit") render();
    }, () => { });
    renderNotes(); renderRail();
  } catch { /* stays local */ }
}
function summaryMarkdown() {
  const lines = ["# ABA Phase 1 walkthrough sign-off", "", `Reviewer: ${SO.names[SO.me] || "(this browser)"} · ${fmtStamp(Date.now())}`, "", "| # | Step | Verdict | Note | All reviewers |", "|---|---|---|---|---|"];
  STEPS.forEach((s, i) => { const m = SO.mine[s.id]; lines.push(`| ${i + 1} | ${s.title} | ${m ? m.v : "—"} | ${(m?.note || "").replace(/\|/g, "/").replace(/\n/g, " ")} | ${aggregate(s.id) || "—"} |`); });
  return lines.join("\n");
}

/* ============================================================
   Rendering
   ============================================================ */
function renderRail() {
  let html = "", lastAct = "";
  STEPS.forEach((s, i) => { if (s.act !== lastAct) { html += `<div class="act">${esc(s.act)}</div>`; lastAct = s.act; }
    const m = SO.mine[s.id]; html += `<button class="${i === S.step ? "cur" : ""}" data-act="goto" data-arg="${i}"><span class="n">${i + 1}</span><span>${esc(s.title)}</span><span class="v">${m ? { pass: "✓", concern: "◐", fail: "✗" }[m.v] : ""}</span></button>`; });
  $("#rail").innerHTML = html;
  $("#step-select").innerHTML = STEPS.map((s, i) => `<option value="${i}" ${i === S.step ? "selected" : ""}>${i + 1}. ${esc(s.title)}${SO.mine[s.id] ? " · " + SO.mine[s.id].v : ""}</option>`).join("");
}
function renderNotes() {
  const s = STEPS[S.step]; const m = SO.mine[s.id];
  $("#verify-sheet").innerHTML = `<h3>What to verify</h3><ul class="checks">${s.verify.map((v, i) => `<li><input type="checkbox" id="vc-${s.id}-${i}" ${S.ui["vc-" + s.id + "-" + i] ? "checked" : ""} data-uicheck="vc-${s.id}-${i}"><label for="vc-${s.id}-${i}">${esc(v)}</label></li>`).join("")}</ul>
    ${s.decisions.length ? `<div style="margin-top:12px">${s.decisions.map(([id, t]) => `<div class="dec"><b>${id}</b> Decision needed: ${esc(t)}</div>`).join("")}</div>` : ""}
    <p class="spec" style="margin:10px 0 0">Spec: ${esc(s.spec)}</p>`;
  const others = Object.entries(SO.all).filter(([id, d]) => id !== SO.me && d?.steps?.[s.id]);
  $("#signoff-sheet").innerHTML = `<h3>Your sign-off</h3><div class="verdicts">${["pass", "concern", "fail"].map(v => `<button class="${v} ${m?.v === v ? "on" : ""}" data-act="verdict" data-arg="${v}">${v === "pass" ? "✓ Pass" : v === "concern" ? "◐ Concern" : "✗ Fail"}</button>`).join("")}</div>
    <div class="field" style="margin-top:8px"><label for="so-note">Note${m && m.v !== "pass" ? " (please say what's wrong)" : ""}</label><textarea id="so-note" rows="2" placeholder="What should change?">${esc(m?.note || "")}</textarea></div>
    <div class="row" style="margin-top:6px"><button class="btn sm" data-act="saveNote">Save note</button><span class="tiny muted">${SO.mode === "shared" ? "Shared with everyone reviewing this page." : "Saved in this browser only. Copy the summary in step 20."}</span></div>
    ${others.length ? `<div class="others"><b class="tiny">Other reviewers</b>${others.map(([id, d]) => `<div>${verdictPill(d.steps[s.id].v)} <b>${esc(SO.names[id] || "Someone")}</b>${d.steps[s.id].note ? `: ${esc(d.steps[s.id].note)}` : ""}</div>`).join("")}</div>` : ""}`;
  renderDB();
}
function renderDB() {
  const flash = Date.now() - 2500;
  $("#db-sheet").innerHTML = `<h3>Live database <span class="pill neutral mono" style="text-transform:none;letter-spacing:0">aba_${S.env}</span></h3><p class="tiny muted" style="margin:0 0 6px">Row counts read from the in-browser stand-in for PostgreSQL. A green number shows rows added since this step began.</p>
  <table class="t"><tr><th>Table</th><th class="num">Rows</th><th class="num">This step</th></tr>${TABLES.map(t => { const dlt = count(t) - (stepBaseline[t] ?? count(t)); return `<tr class="${(lastTouched[t] || 0) > flash ? "flash" : ""}"><td class="mono">${t}</td><td class="num">${count(t).toLocaleString()}</td><td class="num">${dlt ? `<span class="delta">${dlt > 0 ? "+" : ""}${dlt}</span>` : ""}</td></tr>`; }).join("")}</table>`;
}
function render() {
  const s = STEPS[S.step];
  $("#st-eyebrow").textContent = `Step ${S.step + 1} of ${STEPS.length} · ${s.act}`;
  $("#st-title").textContent = s.title; $("#st-lede").textContent = s.lede;
  $("#stage").innerHTML = s.render();
  $("#prog-label").textContent = `${S.step + 1} / ${STEPS.length}`; $("#prog-bar").style.width = `${(S.step + 1) / STEPS.length * 100}%`;
  $("#prev-btn").disabled = S.step === 0; $("#next-btn").disabled = S.step === STEPS.length - 1;
  $("#next-btn").textContent = S.step === STEPS.length - 1 ? "End of walkthrough" : `Next: ${STEPS[S.step + 1].title} →`;
  renderRail(); renderNotes();
}
function go(i) {
  if (i < 0 || i >= STEPS.length) return;
  S.step = i; stepBaseline = snapCounts(); const st = STEPS[i]; if (st.enter) st.enter(); render();
  $("#stage-col").scrollIntoView({ block: "start", behavior: "smooth" });
}

/* event delegation */
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]"); if (!el || el.disabled) return;
  const fn = A[el.dataset.act]; if (!fn) return;
  e.preventDefault();
  const out = fn(el.dataset.arg);
  if (out !== false && !["next", "prev", "goto"].includes(el.dataset.act)) render();
});
document.addEventListener("input", (e) => {
  const el = e.target;
  if (el.dataset.form && el.tagName !== "SELECT") { const f = S.forms[el.dataset.form]; if (!f) return; if (!el._snap) { el._snap = true; f.undo.push(structuredClone(f.vals)); if (f.undo.length > 50) f.undo.shift(); f.redo = []; } f.vals[el.dataset.field] = el.value; softRefresh(el); }
  if (el.dataset.ui) { S.ui[el.dataset.ui] = el.value; }
});
document.addEventListener("change", (e) => {
  const el = e.target;
  if (el.dataset.form) { el._snap = false; if (el.tagName === "SELECT" && S.forms[el.dataset.form]) { formCommit(el.dataset.form, el.dataset.field, el.value); render(); } }
  if (el.dataset.ui) { S.ui[el.dataset.ui] = el.value; if (el.dataset.ui === "gStudent") S.ui.gProg = DB.programs.find(p => p.student_id === el.value).id; if (["gStudent", "gProg"].includes(el.dataset.ui)) { S.ui.gBar = undefined; S.ui.phBefore = undefined; } render(); }
  if (el.dataset.uicheck) S.ui[el.dataset.uicheck] = el.checked;
  if (el.id === "step-select") go(+el.value);
});
function refocus(id) { if (!id) return; const n = document.getElementById(id); if (n && n.tagName !== "SELECT") { n.focus(); try { const L = n.value.length; n.setSelectionRange(L, L); } catch { } } }
/* live-update derived bits while typing, without losing focus */
let softT; function softRefresh(el) { clearTimeout(softT); softT = setTimeout(() => { const id = el.id; const pos = el.selectionStart; render(); const n = document.getElementById(id); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch { } n._snap = true; } }, 350); }
document.addEventListener("keydown", (e) => {
  const el = e.target; const key = el?.dataset?.form; if (!key || !(e.ctrlKey || e.metaKey) || e.key.toLowerCase() !== "z" && e.key.toLowerCase() !== "y") return;
  e.preventDefault(); el._snap = false; const id = el.id;
  if (e.key.toLowerCase() === "y" || e.shiftKey) A.formRedo(key); else A.formUndo(key);
  render(); refocus(id);
});
/* clocks */
setInterval(() => {
  document.querySelectorAll("[data-clock]").forEach(n => n.textContent = n.hasAttribute("data-full") ? fmtStamp(Date.now()) : fmtTime(Date.now()));
  document.querySelectorAll("[data-since]").forEach(n => n.textContent = "⏱ " + mmss((Date.now() - +n.dataset.since) / 1000));
  document.querySelectorAll("[data-run]").forEach(n => n.textContent = mmss((Date.now() - +n.dataset.run) / 1000));
}, 1000);

function boot() {
  S = freshState(); seed(); baseline = snapCounts(); stepBaseline = snapCounts(); lastTouched = {};
  S.step = 0; if (STEPS[0].enter) STEPS[0].enter(); render();
}
boot();
initShared();
</script>
