[project]
name = "aba-api"
version = "2.0.0"
description = "ABA data collection & analysis — API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "psycopg[binary,pool]>=3.2",
  "argon2-cffi>=23.1",
  "pyjwt>=2.9",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
